<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEI – Make-Up Class</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="../responsive-components.css">
</head>
<body>
  <!-- Header will be loaded here -->
  <div id="header-placeholder"></div>

  <div class="app-wrapper" id="appWrapper">
    
    <!-- Sidebar will be loaded here -->
    <div id="sidebar-placeholder"></div>

    <!-- Main Content -->
<main class="main-panel">
  <div class="page-header">
    <h1><i class="fas fa-calendar-plus"></i> Create Make-Up Class</h1>
    <p>Create a static make-up class for optional subjects (e.g., Biology, Computer Science)</p>
  </div>

  <div class="card">
    <div class="card-title">
      <i class="fas fa-chalkboard"></i> Make-Up Class Information
    </div>
    
    <form id="makeupClassForm">
      <div class="form-grid-2cols">
        <div class="form-group">
          <label><i class="fas fa-school"></i> Make-Up Class Name <span class="req">*</span></label>
          <input type="text" class="form-control" id="className" placeholder="e.g., Biology Group, Computer Science Group" required>
        </div>

        <div class="form-group">
          <label><i class="fas fa-id-card"></i> Class ID <span class="req">*</span></label>
          <input type="text" class="form-control" id="classId" placeholder="Auto-generated based on class name">
          <div class="class-id-preview" id="classIdPreview" style="display:none;">
            <i class="fas fa-info-circle"></i> <span id="previewText">Class ID will be generated automatically</span>
          </div>
        </div>
      </div>

      <div class="form-grid-3cols">
        <div class="form-group">
          <label><i class="fas fa-calendar-alt"></i> Session <span class="req">*</span></label>
          <input type="text" class="form-control" id="session" placeholder="e.g., 2024-2025, Spring 2025" required>
        </div>

        <div class="form-group">
          <label><i class="fas fa-layer-group"></i> Grade <span class="req">*</span></label>
          <select class="form-control" id="grade" required>
            <option value="">-- Select Grade --</option>
            <option value="Grade 1">Grade 1</option>
            <option value="Grade 2">Grade 2</option>
            <option value="Grade 3">Grade 3</option>
            <option value="Grade 4">Grade 4</option>
            <option value="Grade 5">Grade 5</option>
            <option value="Grade 6">Grade 6</option>
            <option value="Grade 7">Grade 7</option>
            <option value="Grade 8">Grade 8</option>
            <option value="Grade 9">Grade 9</option>
            <option value="Grade 10">Grade 10</option>
          </select>
        </div>

        <!-- REPLACED: parentClass with section -->
        <div class="form-group">
          <label><i class="fas fa-tags"></i> Section <span class="req">*</span></label>
          <input type="text" class="form-control" id="section" placeholder="e.g., A, B, C, or Makeup Group" required>
          <small style="color:#64748b; font-size:12px; margin-top:4px; display:block;">
            <i class="fas fa-info-circle"></i> Section identifier for this makeup class
          </small>
        </div>
      </div>

      <div class="form-grid-full">
        <div class="form-group">
          <label><i class="fas fa-align-left"></i> Description</label>
          <textarea class="form-control" id="description" placeholder="Describe the make-up class purpose (e.g., For students opting Biology, For students opting Computer Science)"></textarea>
        </div>
      </div>

      <div class="btn-actions">
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-save"></i> Create Make-Up Class
        </button>
        <button type="reset" class="btn btn-secondary" id="resetBtn">
          <i class="fas fa-undo"></i> Reset
        </button>
        <a href="makeup-details.html" class="btn btn-secondary">
          <i class="fas fa-list"></i> View All Make-Up Classes
        </a>
        <a href="index.html" class="btn btn-secondary">
          <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
      </div>
    </form>
  </div>
</main>

<script src="../components.js"></script>
<script>
  // Load Header and Sidebar
  function loadComponents() {
    fetch('header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-placeholder').innerHTML = data;
      })
      .catch(err => console.error('Error loading header:', err));

    fetch('sidebar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('sidebar-placeholder').innerHTML = data;
      })
      .catch(err => console.error('Error loading sidebar:', err));
  }

  window.onload = function() {
    loadComponents();
    
    setTimeout(() => {
      if (typeof window.initHeaderAndSidebar === 'function') {
        window.initHeaderAndSidebar();
      }
    }, 400);

    // No need to populate parent class dropdown anymore
  };

  // ===== Storage Helpers =====
  function loadFromStorage(key) {
    const stored = localStorage.getItem(key);
    return stored ? JSON.parse(stored) : [];
  }

  function saveToStorage(key, data) {
    localStorage.setItem(key, JSON.stringify(data));
  }

  function showToast(msg) {
    let t = document.createElement('div');
    t.className = 'toast-msg';
    t.innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2400);
  }

  // Auto-generate Class ID
  const classNameInput = document.getElementById('className');
  const classIdInput = document.getElementById('classId');
  const classIdPreview = document.getElementById('classIdPreview');
  const previewTextSpan = document.getElementById('previewText');

  function generateClassId(name) {
    if (!name || !name.trim()) return '';
    let base = name.trim().toUpperCase().replace(/[^A-Z0-9\s]/g, '');
    const words = base.split(/\s+/);
    let shortId = '';
    
    if (words.length === 1) {
      shortId = words[0].substring(0, 5);
    } else {
      const max = Math.min(words.length, 3);
      for (let i = 0; i < max; i++) {
        shortId += words[i].charAt(0);
      }
    }
    
    const randomNum = Math.floor(Math.random() * 900) + 100;
    return `MUC-${shortId}-${randomNum}`;
  }

  function updateClassId() {
    const name = classNameInput.value.trim();
    if (!name) {
      classIdInput.value = '';
      classIdPreview.style.display = 'none';
      return;
    }
    
    const id = generateClassId(name);
    classIdInput.value = id;
    previewTextSpan.innerHTML = `Class ID: <strong>${id}</strong> (auto-generated)`;
    classIdPreview.style.display = 'block';
  }

  classNameInput.addEventListener('input', updateClassId);

  // Form Submission
  document.getElementById('makeupClassForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const className = document.getElementById('className').value.trim();
    const classId = document.getElementById('classId').value.trim();
    const session = document.getElementById('session').value.trim();
    const grade = document.getElementById('grade').value;
    const section = document.getElementById('section').value.trim();
    const description = document.getElementById('description').value.trim();

    if (!className || !classId || !session || !grade || !section) {
      showToast('⚠️ Please fill all required fields');
      return;
    }

    const makeupClasses = loadFromStorage('messMakeupClasses');
    if (makeupClasses.some(c => c.id.toLowerCase() === classId.toLowerCase())) {
      showToast(`⚠️ Class ID "${classId}" already exists`);
      return;
    }

    // Create makeup class WITHOUT parent class
    makeupClasses.push({
      id: classId,
      name: className,
      session: session,
      grade: grade,
      section: section,  // NEW: section field
      description: description,
      type: 'makeup',
      status: 'Active',
      createdDate: new Date().toLocaleString()
    });

    saveToStorage('messMakeupClasses', makeupClasses);
    showToast(`✅ Make-Up Class "${className}" created successfully`);
    document.getElementById('makeupClassForm').reset();
    classIdInput.value = '';
    classIdPreview.style.display = 'none';
  });
</script>
</body>
</html>
