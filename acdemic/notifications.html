<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEI – Send Notification</title>
 <link rel="icon" type="image/png" href="../logo2.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="../responsive-components.css">
</head>
<body>
  <!-- Header will be loaded here -->
  <div id="header-placeholder"></div>

  <div class="app-wrapper" id="appWrapper">
    
    <!-- Sidebar will be loaded here -->
    <div id="sidebar-placeholder"></div>

    <!-- Main Content -->
<main class="main-panel">
  <div class="page-header">
    <h1><i class="fas fa-bell"></i> Send Notification</h1>
    <p>Create and send announcements</p>
  </div>

  <div class="card">
    <div class="card-title">
      <i class="fas fa-envelope-open-text"></i> Notification Details
    </div>
    
    <form id="notificationForm">
      <div class="form-grid">
        <div class="form-group">
          <label><i class="fas fa-heading"></i> Notification Title <span class="req">*</span></label>
          <input type="text" class="form-control" id="notificationTitle" placeholder="e.g., Holiday Announcement" required>
        </div>
        <div class="form-group">
          <label><i class="fas fa-align-left"></i> Description <span class="req">*</span></label>
          <textarea class="form-control" id="notificationDesc" placeholder="Write detailed description..." required></textarea>
        </div>
        <div class="form-group">
          <label><i class="fas fa-paperclip"></i> Attachment <span style="font-weight:normal;color:#64748b">(PDF or Image)</span></label>
          <input type="file" id="attachmentInput" accept=".pdf,image/*" style="display:none">
          <div class="attachment-area" id="attachmentArea">
            <div class="attachment-icon"><i class="fas fa-cloud-upload-alt"></i></div>
            <p><strong>Click to upload</strong> or drag and drop</p>
            <p class="file-format-hint">PDF, JPG, PNG, GIF, WEBP (Max 10MB)</p>
          </div>
          <div class="file-info" id="fileInfo">
            <div class="file-details"><i class="fas fa-file-pdf" id="fileIcon"></i><span id="fileName">No file selected</span></div>
            <button type="button" class="btn-remove-file" id="removeFileBtn"><i class="fas fa-times"></i></button>
          </div>
          <div class="image-preview" id="imagePreview"><img id="previewImg" alt="Preview"></div>
        </div>
      </div>

      <div class="btn-actions">
        <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Send Notification</button>
        <button type="button" class="btn btn-secondary" onclick="resetForm()"><i class="fas fa-undo"></i> Reset</button>
        <a href="view-announcements.html" class="btn btn-secondary" id="viewNotificationsBtn"><i class="fas fa-bell"></i> View All Notifications</a>
        <a href="index.html" class="btn btn-secondary" id="backDashboardBtn"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
      </div>
    </form>
  </div>
</main>
<script src="../components.js"></script>
<script>
  // Load Header and Sidebar
    function loadComponents() {
      fetch('header.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('header-placeholder').innerHTML = data;
        })
        .catch(err => console.error('Error loading header:', err));

      fetch('sidebar.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('sidebar-placeholder').innerHTML = data;
        })
        .catch(err => console.error('Error loading sidebar:', err));
    }

    window.onload = function() {
      loadComponents();
      
      setTimeout(() => {
        if (typeof window.initHeaderAndSidebar === 'function') {
          window.initHeaderAndSidebar();
        }
      }, 400);
    };

const form=document.getElementById('notificationForm');
const title=document.getElementById('notificationTitle');
const desc=document.getElementById('notificationDesc');
const fileInput=document.getElementById('attachmentInput');
const area=document.getElementById('attachmentArea');
const fileInfo=document.getElementById('fileInfo');
const fileNameSpan=document.getElementById('fileName');
const fileIcon=document.getElementById('fileIcon');
const removeBtn=document.getElementById('removeFileBtn');
const imgPreview=document.getElementById('imagePreview');
const previewImg=document.getElementById('previewImg');

let currentFile=null;
let currentFileDataUrl=null;

area.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',e=>{
  const file=e.target.files[0];
  if(file){
    currentFile=file;
    fileNameSpan.textContent=file.name;
    fileInfo.classList.add('show');
    if(file.type.startsWith('image/')){
      fileIcon.className='fas fa-file-image';
      const reader=new FileReader();
      reader.onload=ev=>{
        previewImg.src=ev.target.result;
        imgPreview.classList.add('show');
        currentFileDataUrl = ev.target.result;
      };
      reader.readAsDataURL(file);
    } else {
      fileIcon.className='fas fa-file-pdf';
      imgPreview.classList.remove('show');
      currentFileDataUrl = null;
    }
  }
});

removeBtn.addEventListener('click',()=>{
  fileInput.value='';
  currentFile=null;
  currentFileDataUrl=null;
  fileInfo.classList.remove('show');
  imgPreview.classList.remove('show');
});

// ===== Storage Helpers =====
function loadFromStorage(key) {
  const stored = localStorage.getItem(key);
  return stored ? JSON.parse(stored) : [];
}
function saveToStorage(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}

form.addEventListener('submit',e=>{
  e.preventDefault();
  if(!title.value.trim()||!desc.value.trim()){
    alert("Title and Description are required!");
    return;
  }

  const notifications = loadFromStorage('messNotifications');
  notifications.push({
    id: 'NOTIF-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
    title: title.value.trim(),
    description: desc.value.trim(),
    fileName: currentFile ? currentFile.name : null,
    fileType: currentFile ? currentFile.type : null,
    fileDataUrl: currentFileDataUrl,
    date: new Date().toISOString(),
    postedBy: 'Administration'
  });
  saveToStorage('messNotifications', notifications);

  alert(`✅ Notification Sent!\n\nTitle: ${title.value}\nDescription: ${desc.value.substring(0,100)}...`);
  resetForm();
});

function resetForm(){
  form.reset();
  currentFile=null;
  currentFileDataUrl=null;
  fileInfo.classList.remove('show');
  imgPreview.classList.remove('show');
}

document.getElementById('viewNotificationsBtn').addEventListener('click',e=>{
  e.preventDefault();
  window.location.href = 'view-notifications.html';
});
document.getElementById('backDashboardBtn').addEventListener('click',e=>{
  e.preventDefault();
  window.location.href = 'academic-index.html';
});
</script>
</body>
</html>
