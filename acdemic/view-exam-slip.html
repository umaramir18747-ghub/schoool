<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEI – Exam Slip History</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="../responsive-components.css">
<link rel="stylesheet" href="view-details.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="app-wrapper" id="appWrapper">
    <div id="sidebar-placeholder"></div>

    <main class="main-panel">
      <div class="page-header">
        <h1><i class="fas fa-file-alt" style="color:#2563eb;"></i> Exam Slip History</h1>
        <p>Every exam schedule generated from Manage Exam Slip, grouped by class</p>
      </div>

      <div class="card">
        <div class="card-title">
          <i class="fas fa-list-alt"></i> Assigned Exam Slips
        </div>
        <div class="search-wrap">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Search by class or subject…" onkeyup="applyFilters()">
        </div>
        <div id="slipsContainer"></div>
      </div>
    </main>
  </div>

<script src="../components.js"></script>
<script>
  function loadComponents() {
    fetch('header.html').then(r => r.text()).then(data => document.getElementById('header-placeholder').innerHTML = data);
    fetch('sidebar.html').then(r => r.text()).then(data => document.getElementById('sidebar-placeholder').innerHTML = data);
  }

  window.onload = function() {
    loadComponents();
    setTimeout(() => { if (typeof window.initHeaderAndSidebar === 'function') window.initHeaderAndSidebar(); }, 400);
    applyFilters();
  };

  // ===== Storage Helpers =====
  function loadFromStorage(key) {
    const stored = localStorage.getItem(key);
    return stored ? JSON.parse(stored) : [];
  }
  function saveToStorage(key, data) {
    localStorage.setItem(key, JSON.stringify(data));
  }
  function showToast(msg) {
    let t = document.createElement('div');
    t.className = 'toast-msg';
    t.innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2400);
  }

  function formatDisplayDate(dateStr) {
    if (!dateStr) return '—';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  }
  function formatDisplayTime(timeStr) {
    if (!timeStr) return '—';
    const [h, m] = timeStr.split(':').map(Number);
    const period = h >= 12 ? 'PM' : 'AM';
    const h12 = h % 12 === 0 ? 12 : h % 12;
    return `${String(h12).padStart(2,'0')}:${String(m).padStart(2,'0')} ${period}`;
  }

  function applyFilters() {
    const search = document.getElementById('searchInput').value.toLowerCase().trim();
    let slips = loadFromStorage('messExamSlips');

    if (search) {
      slips = slips.filter(s =>
        s.className.toLowerCase().includes(search) ||
        s.exams.some(ex => ex.subject.toLowerCase().includes(search))
      );
    }

    renderSlips(slips);
  }

  function renderSlips(slips) {
    const container = document.getElementById('slipsContainer');

    if (slips.length === 0) {
      container.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>No exam slips found.</p></div>`;
      return;
    }

    // Remove ${idx === 0 ? 'open' : ''} to keep all closed by default
    container.innerHTML = slips.map((slip, idx) => `
      <details class="slip-accordion">
        <summary>
          <div class="summary-left">
            <i class="fas fa-file-alt slip-icon"></i>
            <div>
              <h3>${slip.className} <span style="color:#94a3b8;font-weight:600;">(${slip.classId})</span></h3>
              <span>${slip.exams.length} exam${slip.exams.length > 1 ? 's' : ''} scheduled · Grade ${slip.grade}, Section ${slip.section}</span>
            </div>
          </div>
          <div class="summary-right">
            <button type="button" class="delete-slip-btn" data-classid="${slip.classId}"><i class="fas fa-trash-alt"></i> Delete Entire Slip</button>
            <i class="fas fa-chevron-down chevron"></i>
          </div>
        </summary>
        <div class="table-wrapper">
          <table class="exam-table">
            <thead>
              <tr><th>Subject</th><th>Date</th><th>Day</th><th>Time</th><th>Teacher</th><th style="text-align:right">Action</th></tr>
            </thead>
            <tbody>
              ${slip.exams.map((ex, exIdx) => `
                <tr>
                  <td>${ex.subject}</td>
                  <td>${formatDisplayDate(ex.date)}</td>
                  <td>${ex.day}</td>
                  <td>${formatDisplayTime(ex.time)}</td>
                  <td>${ex.teacher}</td>
                  <td style="text-align:right"><i class="fas fa-trash-alt exam-delete-icon" data-classid="${slip.classId}" data-examindex="${exIdx}" title="Delete this exam"></i></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </details>
    `).join('');

    document.querySelectorAll('.delete-slip-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        deleteEntireSlip(btn.dataset.classid);
      });
    });

    document.querySelectorAll('.exam-delete-icon').forEach(icon => {
      icon.addEventListener('click', () => {
        deleteSingleExam(icon.dataset.classid, parseInt(icon.dataset.examindex, 10));
      });
    });
  }

  function deleteEntireSlip(classId) {
    const slips = loadFromStorage('messExamSlips');
    const slip = slips.find(s => s.classId === classId);
    if (!slip) return;

    if (!confirm(`Delete the entire exam slip for ${slip.className}? This removes all ${slip.exams.length} exam entr${slip.exams.length > 1 ? 'ies' : 'y'} for this class.`)) return;

    const updated = slips.filter(s => s.classId !== classId);
    saveToStorage('messExamSlips', updated);
    showToast('🗑️ Exam slip deleted');
    applyFilters();
  }

  function deleteSingleExam(classId, examIndex) {
    const slips = loadFromStorage('messExamSlips');
    const slip = slips.find(s => s.classId === classId);
    if (!slip) return;

    const exam = slip.exams[examIndex];
    if (!exam) return;

    if (!confirm(`Remove "${exam.subject}" from ${slip.className}'s exam schedule?`)) return;

    slip.exams.splice(examIndex, 1);

    let updated;
    if (slip.exams.length === 0) {
      // No exams left for this class — drop the whole record
      updated = slips.filter(s => s.classId !== classId);
    } else {
      updated = slips.map(s => s.classId === classId ? slip : s);
    }

    saveToStorage('messExamSlips', updated);
    showToast('🗑️ Exam entry removed');
    applyFilters();
  }
</script>
</body>
</html>
