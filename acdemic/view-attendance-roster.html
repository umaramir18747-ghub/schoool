<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEi – Attendance Roster History</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="../responsive-components.css">
  <link rel="stylesheet" href="view-details.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="app-wrapper" id="appWrapper">
    <div id="sidebar-placeholder"></div>

    <main class="main-panel">
      <div class="page-header">
        <h1><i class="fas fa-clipboard-user" style="color:#2563eb;"></i> Attendance Roster History</h1>
        <p>Every roster generated from Attendance Roster, grouped by class with status indicators</p>
      </div>

      <div class="card">
        <div class="card-title">
          <i class="fas fa-list-alt"></i> All Rosters
          <span id="recordCountBadge" style="background:#eff6ff;color:#2563eb;font-size:13px;font-weight:700;padding:3px 11px;margin-left:4px;border:1px solid #dbeafe;">0</span>
        </div>

        <div class="search-wrap">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Search by class or teacher…" oninput="applyFilters()">
        </div>

        <div id="rostersContainer"></div>
      </div>
    </main>
  </div>

  <script src="../components.js"></script>
  <script>
    function loadComponents() {
      fetch('header.html').then(r => r.text()).then(data => document.getElementById('header-placeholder').innerHTML = data);
      fetch('sidebar.html').then(r => r.text()).then(data => document.getElementById('sidebar-placeholder').innerHTML = data);
    }

    window.onload = function() {
      loadComponents();
      setTimeout(() => { if (typeof window.initHeaderAndSidebar === 'function') window.initHeaderAndSidebar(); }, 400);
      applyFilters();
    };

    // ===== Storage Helpers =====
    function loadFromStorage(key) {
      const stored = localStorage.getItem(key);
      return stored ? JSON.parse(stored) : [];
    }
    function saveToStorage(key, data) {
      localStorage.setItem(key, JSON.stringify(data));
    }
    function showToast(msg) {
      let t = document.createElement('div');
      t.className = 'toast-msg';
      t.innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2400);
    }

    function formatDisplayDate(dateStr) {
      if (!dateStr) return '—';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    // Format last marked time from timestamp
    function formatLastMarkedTime(timestamp) {
      if (!timestamp) return '—';
      const date = new Date(timestamp);
      if (isNaN(date.getTime())) return '—';
      return date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function applyFilters() {
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      let records = loadFromStorage('messAttendanceRosters')
        .sort((a, b) => new Date(b.date) - new Date(a.date));

      if (search) {
        records = records.filter(r =>
          r.className.toLowerCase().includes(search) ||
          r.teacherName.toLowerCase().includes(search)
        );
      }

      renderGroupedRosters(records);
    }

    function renderGroupedRosters(records) {
      const container = document.getElementById('rostersContainer');
      document.getElementById('recordCountBadge').textContent = records.length;

      if (records.length === 0) {
        container.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>No attendance rosters found.</p></div>`;
        return;
      }

      // Group records by classId
      const grouped = {};
      records.forEach(r => {
        if (!grouped[r.classId]) {
          grouped[r.classId] = {
            className: r.className,
            classId: r.classId,
            rosters: []
          };
        }
        grouped[r.classId].rosters.push(r);
      });

      container.innerHTML = Object.values(grouped).map((group, idx) => {
        // Calculate status counts for the badge
        const total = group.rosters.length;
        const marked = group.rosters.filter(r => r.marked).length;
        const pending = total - marked;
        
        return `
          <details class="slip-accordion">
            <summary>
              <div class="summary-left">
                <i class="fas fa-clipboard-user slip-icon" style="color:#2563eb;"></i>
                <div>
                  <h3>${group.className} <span style="color:#94a3b8;font-weight:600;">(${group.classId})</span></h3>
                  <span>${total} roster${total > 1 ? 's' : ''} · 
                    <span style="color:#22c55e;">${marked} marked</span> · 
                    <span style="color:#f59e0b;">${pending} pending</span>
                  </span>
                </div>
              </div>
              <div class="summary-right">
                <i class="fas fa-chevron-down chevron"></i>
              </div>
            </summary>
            <div class="table-wrapper">
              <table class="exam-table">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Teacher</th>
                    <th>Status</th>
                    <th>Last Marked</th>
                    <th style="text-align:right">Action</th>
                  </tr>
                </thead>
                <tbody>
                  ${group.rosters.map((r, rosterIdx) => {
                    const statusHtml = r.marked
                      ? `<span class="status-badge status-active"><i class="fas fa-check-circle"></i> Marked</span>`
                      : `<span class="status-badge status-inactive"><i class="fas fa-clock"></i> Pending</span>`;
                    
                    const lastMarkedDisplay = r.marked 
                      ? `<div style="font-size:13px; color:#64748b;"><i class="fas fa-clock"></i> ${formatLastMarkedTime(r.lastMarkedTime)}</div>`
                      : `<div style="font-size:13px; color:#94a3b8;">—</div>`;
                    
                    return `
                      <tr>
                        <td>${formatDisplayDate(r.date)}</td>
                        <td>${r.teacherName}</td>
                        <td>${statusHtml}</td>
                        <td>${lastMarkedDisplay}</td>
                        <td style="text-align:right">
                          <i class="fas fa-trash-alt exam-delete-icon" data-classid="${group.classId}" data-rosterindex="${rosterIdx}" title="Delete this roster"></i>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </details>
        `;
      }).join('');

      // Delete single roster
      document.querySelectorAll('.exam-delete-icon').forEach(icon => {
        icon.addEventListener('click', () => {
          deleteSingleRoster(icon.dataset.classid, parseInt(icon.dataset.rosterindex, 10));
        });
      });
    }

    function deleteSingleRoster(classId, rosterIndex) {
      const records = loadFromStorage('messAttendanceRosters');
      const classRosters = records.filter(r => r.classId === classId);
      if (classRosters.length === 0 || rosterIndex >= classRosters.length) return;

      const roster = classRosters[rosterIndex];
      const warnMarked = roster.marked
        ? '\n\n⚠️ This roster has already been marked — its saved attendance records will also be deleted.'
        : '';

      if (!confirm(`Delete the roster for ${roster.className} on ${formatDisplayDate(roster.date)}?${warnMarked}`)) return;

      // Remove this specific roster
      const updatedRosters = records.filter(r => r.id !== roster.id);
      saveToStorage('messAttendanceRosters', updatedRosters);

      // Cascade: remove attendance records for this specific class + date
      const allAttendance = loadFromStorage('messAttendanceRecords');
      const updatedAttendance = allAttendance.filter(a => 
        !(a.classId === roster.classId && a.date === roster.date)
      );
      saveToStorage('messAttendanceRecords', updatedAttendance);

      showToast('🗑️ Roster deleted');
      applyFilters();
    }
  </script>
</body>
</html>
