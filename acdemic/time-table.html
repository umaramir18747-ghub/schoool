<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EHS – Timetable</title>
 <link rel="icon" type="image/png" href="../logo2.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet" href="time-table.css">
<link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="../responsive-components.css">
</head>
<body>

<!-- Components loaded externally -->
<div id="header-placeholder"></div>

<div class="app-wrapper" id="appWrapper">
  <div id="sidebar-placeholder"></div>

  <main class="main-panel">
    <!-- Page Header -->
    <div class="page-header">
      <h1><i class="fas fa-clock"></i> Timetable</h1>
      <p>Manage weekly class timetable &nbsp;·&nbsp; Click cells to select, then merge adjacent periods into long blocks.</p>
    </div>

    <!-- Class Information -->
    <div class="card">
      <div class="card-title"><i class="fas fa-chalkboard"></i> Class Information</div>
      <div class="form-grid-5cols">
        <div class="form-group">
          <label><i class="fas fa-chalkboard-teacher"></i> Class Name <span class="req">*</span></label>
          <select id="classSelect" class="form-control" onchange="fillClassDetails()">
            <option value="">-- Select Class --</option>
            <option value="Class A">Class A</option>
            <option value="Class B">Class B</option>
            <option value="Class C">Class C</option>
          </select>
        </div>
        <div class="form-group">
          <label><i class="fas fa-id-card"></i> Class ID</label>
          <input type="text" id="s_classId" class="form-control" disabled placeholder="Auto-generated">
        </div>
        <div class="form-group">
          <label><i class="fas fa-calendar-alt"></i> Session</label>
          <input type="text" id="s_session" class="form-control" disabled placeholder="Session">
        </div>
        <div class="form-group">
          <label><i class="fas fa-layer-group"></i> Grade</label>
          <input type="text" id="s_grade" class="form-control" disabled placeholder="Grade">
        </div>
        <div class="form-group">
          <label><i class="fas fa-tags"></i> Section</label>
          <input type="text" id="s_section" class="form-control" disabled placeholder="Section">
        </div>
      </div>
    </div>

    <!-- Timetable -->
    <div class="card">
      <div class="card-title"><i class="fas fa-table"></i> Weekly Timetable</div>

      <div class="timetable-wrapper">
        <div id="timetableGrid" class="timetable-grid"></div>
      </div>

      <!-- Merge Toolbar -->
      <div class="merge-toolbar">
        <span class="merge-status"><i class="fas fa-mouse-pointer"></i> <span id="selectionStatus">No cells selected</span></span>
        <button class="btn-sm" id="btnMerge"><i class="fas fa-object-group"></i> Merge Selected</button>
        <button class="btn-sm" id="btnClearSel"><i class="fas fa-times-circle"></i> Clear Selection</button>
        <button class="btn-sm btn-sm-danger" id="btnResetMerges"><i class="fas fa-trash-alt"></i> Reset All Merges</button>
        <span class="merge-hint"><i class="fas fa-info-circle"></i> Select adjacent cells in the same row to merge</span>
      </div>

      <!-- Action Buttons -->
      <div class="btn-actions">
        <button class="btn btn-primary" onclick="saveTimetable()"><i class="fas fa-save"></i> Save Timetable</button>
        <button class="btn btn-secondary" onclick="fullReset()"><i class="fas fa-undo"></i> Reset</button>
        <a href="#" class="btn btn-secondary"><i class="fas fa-eye"></i> View All Timetables</a>
        <a href="#" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
      </div>
    </div>
  </main>
</div>

<script src="../components.js"></script>
<script>
// ─── Constants ────────────────────────────────────────────────
const DAYS         = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const PERIODS      = 8;

// ─── Storage Helpers ───────────────────────────────────────────
function loadFromStorage(key) {
  const stored = localStorage.getItem(key);
  return stored ? JSON.parse(stored) : [];
}
function saveToStorage(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}

function populateClassDropdown() {
  const select = document.getElementById('classSelect');
  const classes = loadFromStorage('messClasses');
  select.innerHTML = '<option value="">-- Select Class --</option>' +
    classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
}

// ─── State ────────────────────────────────────────────────────
let subjectData  = [];   // [row][col] → subject string
let mergeBlocks  = [];   // { rowIdx, startCol, endCol, subjectText }
let selectedKeys = new Set(); // "row,col"
let currentPeriodsMeta = null; // periods meta for the currently loaded class

// ─── Helpers ─────────────────────────────────────────────────
function initSubjectData() {
  return DAYS.map(() => Array(PERIODS).fill(""));
}

function escHtml(str) {
  return str ? str.replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])) : '';
}

// ─── Class Info ───────────────────────────────────────────────
function fillClassDetails() {
  const classId = document.getElementById('classSelect').value;
  const cls = loadFromStorage('messClasses').find(c => c.id === classId);
  document.getElementById('s_classId').value = cls ? cls.id : '';
  document.getElementById('s_session').value = cls ? cls.session : '';
  document.getElementById('s_grade').value = cls ? cls.grade : '';
  document.getElementById('s_section').value = cls ? cls.section : '';

  loadTimetableForSelectedClass();
}

function loadTimetableForSelectedClass() {
  const classId = document.getElementById('classSelect').value;
  subjectData = initSubjectData();
  mergeBlocks = [];
  selectedKeys.clear();
  currentPeriodsMeta = null;

  if (classId) {
    const timetables = loadFromStorage('messTimetables');
    const existing = timetables.find(t => t.classId === classId);
    if (existing) {
      subjectData = existing.subjects || initSubjectData();
      mergeBlocks = existing.merges || [];
      currentPeriodsMeta = existing.periods || null;
    }
  }

  renderTimetable();
  if (currentPeriodsMeta) {
    setTimeout(() => {
      currentPeriodsMeta.forEach((p, i) => {
        const ni = document.querySelector(`[data-pi="${i}"]`);
        const ts = document.querySelector(`[data-ts="${i}"]`);
        const te = document.querySelector(`[data-te="${i}"]`);
        if (ni) ni.value = p.name;
        if (ts) ts.value = p.start;
        if (te) te.value = p.end;
      });
    }, 20);
  }
}

// ─── Render Timetable ─────────────────────────────────────────
function renderTimetable() {
  const container = document.getElementById('timetableGrid');
  container.innerHTML = '';

  // — Header row —
  const corner = document.createElement('div');
  corner.className = 'grid-cell header-cell header-corner';
  corner.innerHTML = '<i class="fas fa-calendar-alt"></i> Day / Period';
  container.appendChild(corner);

  for (let p = 0; p < PERIODS; p++) {
    const cell = document.createElement('div');
    cell.className = 'grid-cell header-cell';
    cell.innerHTML = `
      <div class="period-header-content">
        <input type="text" class="period-name-input" value="Period ${p+1}" data-pi="${p}">
        <input type="time" class="time-slot-input" value="08:00" data-ts="${p}">
        <span class="time-sep">to</span>
        <input type="time" class="time-slot-input" value="09:00" data-te="${p}">
      </div>`;
    container.appendChild(cell);
  }

  // — Day rows —
  for (let row = 0; row < DAYS.length; row++) {
    // Day label
    const dayCell = document.createElement('div');
    dayCell.className = 'grid-cell day-cell';
    dayCell.innerHTML = `<i class="fas fa-calendar-day"></i> ${DAYS[row]}`;
    container.appendChild(dayCell);

    let col = 0;
    while (col < PERIODS) {
      const block = mergeBlocks.find(m => m.rowIdx === row && m.startCol <= col && m.endCol >= col);

      if (block && block.startCol === col) {
        // — Merged cell —
        const span = block.endCol - block.startCol + 1;
        const mc   = document.createElement('div');
        mc.className = 'grid-cell merged-cell';
        mc.style.gridColumn = `span ${span}`;
        const subject = block.subjectText || subjectData[row]?.[col] || '';
        mc.innerHTML = `
          <div class="merged-content">
            <input type="text" class="merged-subject-input" value="${escHtml(subject)}"
              data-mr="${row}" data-mc="${block.startCol}" placeholder="Subject">
            <span class="merged-badge"><i class="fas fa-link"></i> ${span} period(s)</span>
            <button class="unmerge-btn" data-ur="${row}" data-us="${block.startCol}" data-ue="${block.endCol}">✕ Split</button>
          </div>`;
        container.appendChild(mc);
        // insert hidden dummies to fill gap in grid (grid counts columns)
        for (let s = block.startCol + 1; s <= block.endCol; s++) {
          const dummy = document.createElement('div');
          dummy.style.display = 'none';
          container.appendChild(dummy);
        }
        col = block.endCol + 1;

      } else {
        // — Normal cell —
        const nc = document.createElement('div');
        nc.className = 'grid-cell subject-cell';
        if (selectedKeys.has(`${row},${col}`)) nc.classList.add('selected');
        nc.dataset.row = row;
        nc.dataset.col = col;
        const val = subjectData[row]?.[col] || '';
        nc.innerHTML = `<input type="text" class="subject-input" value="${escHtml(val)}"
          data-row="${row}" data-col="${col}" placeholder="Subject">`;
        container.appendChild(nc);
        col++;
      }
    }
  }

  attachEvents();
}

// ─── Event Binding (one place, no duplicates) ─────────────────
function attachEvents() {
  // Subject inputs → persist to subjectData
  document.querySelectorAll('.subject-input').forEach(inp => {
    inp.addEventListener('change', e => {
      subjectData[+e.target.dataset.row][+e.target.dataset.col] = e.target.value;
    });
  });

  // Merged subject inputs → persist to mergeBlocks
  document.querySelectorAll('.merged-subject-input').forEach(inp => {
    inp.addEventListener('change', e => {
      const row = +e.target.dataset.mr, start = +e.target.dataset.mc;
      const blk = mergeBlocks.find(m => m.rowIdx === row && m.startCol === start);
      if (blk) { blk.subjectText = e.target.value; subjectData[row][start] = e.target.value; }
    });
  });

  // Cell selection toggle (click on cell div, not input)
  document.querySelectorAll('.subject-cell').forEach(cell => {
    cell.addEventListener('click', e => {
      // don't trigger when clicking inside the text input
      if (e.target.tagName === 'INPUT') return;
      toggleCell(cell);
    });
  });

  // Unmerge buttons
  document.querySelectorAll('.unmerge-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const row = +btn.dataset.ur, s = +btn.dataset.us, en = +btn.dataset.ue;
      mergeBlocks = mergeBlocks.filter(m => !(m.rowIdx===row && m.startCol===s && m.endCol===en));
      renderTimetable();
    });
  });
}

// ─── Cell Selection ───────────────────────────────────────────
function toggleCell(cell) {
  const key = `${cell.dataset.row},${cell.dataset.col}`;
  if (selectedKeys.has(key)) {
    selectedKeys.delete(key);
    cell.classList.remove('selected');
  } else {
    selectedKeys.add(key);
    cell.classList.add('selected');
  }
  updateStatus();
}

function updateStatus() {
  const s = document.getElementById('selectionStatus');
  s.innerText = selectedKeys.size === 0
    ? 'No cells selected'
    : `${selectedKeys.size} cell(s) selected`;
}

function clearSelection() {
  selectedKeys.clear();
  renderTimetable();
}

// ─── Merge Logic ──────────────────────────────────────────────
function mergeSelected() {
  if (selectedKeys.size < 2) {
    alert('Select at least 2 adjacent cells in the same row to merge.');
    return;
  }
  // Group by row
  const rowMap = new Map();
  for (const key of selectedKeys) {
    const [r, c] = key.split(',').map(Number);
    if (!rowMap.has(r)) rowMap.set(r, []);
    rowMap.get(r).push(c);
  }
  if (rowMap.size !== 1) { alert('Merge only works within the same row.'); return; }

  const row  = [...rowMap.keys()][0];
  const cols = rowMap.get(row).sort((a,b) => a - b);

  // Check adjacency
  for (let i = 0; i < cols.length - 1; i++) {
    if (cols[i+1] !== cols[i] + 1) { alert('Cells must be consecutive (adjacent).'); return; }
  }

  const startCol = cols[0], endCol = cols[cols.length - 1];

  // Check overlap with existing merges
  const overlap = mergeBlocks.some(m =>
    m.rowIdx === row && (startCol <= m.endCol && endCol >= m.startCol)
  );
  if (overlap) { alert('One or more selected cells are already merged. Split them first.'); return; }

  const firstSubject = subjectData[row]?.[startCol] || '';
  mergeBlocks.push({ rowIdx:row, startCol, endCol, subjectText:firstSubject });
  selectedKeys.clear();
  renderTimetable();
}

// ─── Save / Reset ─────────────────────────────────────────────
function saveTimetable() {
  const classId = document.getElementById('classSelect').value;
  if (!classId) {
    alert('Please select a class first.');
    return;
  }

  const cls = loadFromStorage('messClasses').find(c => c.id === classId);

  // Snapshot all period names & times
  const periods = [];
  for (let p = 0; p < PERIODS; p++) {
    periods.push({
      name:  document.querySelector(`[data-pi="${p}"]`)?.value  || `Period ${p+1}`,
      start: document.querySelector(`[data-ts="${p}"]`)?.value  || '08:00',
      end:   document.querySelector(`[data-te="${p}"]`)?.value  || '09:00',
    });
  }

  const timetables = loadFromStorage('messTimetables');
  const record = {
    classId: classId,
    className: cls ? cls.name : '',
    session: cls ? cls.session : '',
    grade: cls ? cls.grade : '',
    section: cls ? cls.section : '',
    periods,
    subjects: JSON.parse(JSON.stringify(subjectData)),
    merges:   JSON.parse(JSON.stringify(mergeBlocks)),
    savedDate: new Date().toISOString()
  };

  const idx = timetables.findIndex(t => t.classId === classId);
  if (idx !== -1) timetables[idx] = record;
  else timetables.push(record);

  saveToStorage('messTimetables', timetables);
  currentPeriodsMeta = periods;
  alert(`✅ Timetable saved successfully for ${cls ? cls.name : classId}!`);
}

function fullReset() {
  if (!confirm('Reset entire timetable? All subjects, merges and period settings will be cleared.')) return;
  subjectData  = initSubjectData();
  mergeBlocks  = [];
  selectedKeys.clear();
  currentPeriodsMeta = null;
  renderTimetable();
}

// ─── Toolbar Buttons ──────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('btnMerge')    .addEventListener('click', mergeSelected);
  document.getElementById('btnClearSel') .addEventListener('click', clearSelection);
  document.getElementById('btnResetMerges').addEventListener('click', () => {
    if (!mergeBlocks.length) return;
    if (confirm('Remove all merged blocks?')) { mergeBlocks = []; renderTimetable(); }
  });
});

// ─── Bootstrap ───────────────────────────────────────────────
function loadComponents() {
  fetch('header.html').then(r => r.text()).then(html => { document.getElementById('header-placeholder').innerHTML = html; }).catch(() => {});
  fetch('sidebar.html').then(r => r.text()).then(html => { document.getElementById('sidebar-placeholder').innerHTML = html; }).catch(() => {});
}

window.onload = () => {
  loadComponents();
  populateClassDropdown();
  subjectData = initSubjectData();
  renderTimetable();
  setTimeout(() => { if (typeof window.initHeaderAndSidebar === 'function') window.initHeaderAndSidebar(); }, 300);
};
</script>
</body>
</html>
