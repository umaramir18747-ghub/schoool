<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEI – Announcements History</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="../responsive-components.css">
<link rel="stylesheet" href="view-details.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="app-wrapper" id="appWrapper">
    <div id="sidebar-placeholder"></div>

    <main class="main-panel">
      <div class="page-header">
        <h1><i class="fas fa-bell" style="color:#2563eb;"></i> Announcements History</h1>
        <p>Every notification sent from Send Notification, with delete controls</p>
      </div>

      <div class="card">
        <div class="card-title">
          <i class="fas fa-list"></i> All Notifications
        </div>
        <div class="search-wrap">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Search by title or description…" onkeyup="applyFilters()">
        </div>
        <div class="notif-list" id="notifList"></div>
      </div>
    </main>
  </div>

  <script src="../components.js"></script>
  <script>
    function loadComponents() {
      fetch('header.html').then(r => r.text()).then(data => document.getElementById('header-placeholder').innerHTML = data);
      fetch('sidebar.html').then(r => r.text()).then(data => document.getElementById('sidebar-placeholder').innerHTML = data);
    }

    window.onload = function() {
      loadComponents();
      setTimeout(() => { if (typeof window.initHeaderAndSidebar === 'function') window.initHeaderAndSidebar(); }, 400);
      applyFilters();
    };

    // ===== Storage Helpers =====
    function loadFromStorage(key) {
      const stored = localStorage.getItem(key);
      return stored ? JSON.parse(stored) : [];
    }
    function saveToStorage(key, data) {
      localStorage.setItem(key, JSON.stringify(data));
    }
    function showToast(msg) {
      let t = document.createElement('div');
      t.className = 'toast-msg';
      t.innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2400);
    }

    function formatDisplayDateTime(isoStr) {
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return isoStr;
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) +
        ' · ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    }

    function applyFilters() {
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      let notifications = loadFromStorage('messNotifications')
        .sort((a, b) => new Date(b.date) - new Date(a.date));

      if (search) {
        notifications = notifications.filter(n =>
          n.title.toLowerCase().includes(search) ||
          n.description.toLowerCase().includes(search)
        );
      }

      renderNotifications(notifications);
    }

    function renderNotifications(notifications) {
      const list = document.getElementById('notifList');

      if (notifications.length === 0) {
        list.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>No notifications found.</p></div>`;
        return;
      }

      list.innerHTML = notifications.map(n => {
        const isImage = n.fileType && n.fileType.startsWith('image/');
        const attachmentHtml = n.fileName
          ? `<div class="notif-attachment"><i class="fas ${isImage ? 'fa-file-image' : 'fa-file-pdf'}"></i> ${n.fileName}</div>`
          : '';
        const imagePreviewHtml = (isImage && n.fileDataUrl)
          ? `<div class="notif-image-preview"><img src="${n.fileDataUrl}" alt="${n.fileName}"></div>`
          : '';

        return `
          <div class="notif-card">
            <div class="notif-icon"><i class="fas fa-bullhorn"></i></div>
            <div class="notif-body">
              <div class="notif-top">
                <div class="notif-title">${n.title}</div>
                <div class="notif-meta-right">
                  <div class="notif-date">${formatDisplayDateTime(n.date)}</div>
                  <button type="button" class="notif-delete-btn" data-id="${n.id}"><i class="fas fa-trash-alt"></i> Delete</button>
                </div>
              </div>
              <div class="notif-poster"><i class="fas fa-user-shield"></i> ${n.postedBy || 'Administration'}</div>
              <div class="notif-desc">${n.description}</div>
              ${attachmentHtml}
              ${imagePreviewHtml}
            </div>
          </div>
        `;
      }).join('');

      document.querySelectorAll('.notif-delete-btn').forEach(btn => {
        btn.addEventListener('click', () => deleteNotification(btn.dataset.id));
      });
    }

    function deleteNotification(id) {
      const notifications = loadFromStorage('messNotifications');
      const notif = notifications.find(n => n.id === id);
      if (!notif) return;

      if (!confirm(`Delete the notification "${notif.title}"?`)) return;

      const updated = notifications.filter(n => n.id !== id);
      saveToStorage('messNotifications', updated);
      showToast('🗑️ Notification deleted');
      applyFilters();
    }
  </script>
</body>
</html>
