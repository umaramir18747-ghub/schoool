<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEI – Attendance Roster</title>
 <link rel="icon" type="image/png" href="../logo2.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="../responsive-components.css">
</head>
<body>
  <!-- Header will be loaded here -->
  <div id="header-placeholder"></div>

  <div class="app-wrapper" id="appWrapper">
    
    <!-- Sidebar will be loaded here -->
    <div id="sidebar-placeholder"></div>

    <!-- Main Content -->
<main class="main-panel">
  <div class="page-header">
    <h1><i class="fas fa-clipboard-user" style="color:#2563eb;"></i> Attendance Roster</h1>
    <p>Select class and teacher to begin taking attendance</p>
  </div>

  <!-- Class Information -->
  <div class="card">
    <div class="card-title">
      <i class="fas fa-chalkboard"></i> Class Information
    </div>
    <div class="form-grid-5cols">
      <div class="form-group">
        <label><i class="fas fa-chalkboard-teacher"></i> Class Name <span class="req">*</span></label>
        <select class="form-control" id="classSelect" required onchange="fillClassDetails()">
          <option value="">-- Select Class --</option>
          <option value="Class A">Class A</option>
          <option value="Class B">Class B</option>
          <option value="Class C">Class C</option>
        </select>
      </div>
      <div class="form-group">
        <label><i class="fas fa-id-card"></i> Class ID</label>
        <input type="text" class="form-control" id="s_classId" disabled placeholder="Auto-generated">
      </div>
      <div class="form-group">
        <label><i class="fas fa-calendar-alt"></i> Session</label>
        <input type="text" class="form-control" id="s_session" disabled placeholder="Session">
      </div>
      <div class="form-group">
        <label><i class="fas fa-layer-group"></i> Grade</label>
        <input type="text" class="form-control" id="s_grade" disabled placeholder="Grade">
      </div>
      <div class="form-group">
        <label><i class="fas fa-tags"></i> Section</label>
        <input type="text" class="form-control" id="s_section" disabled placeholder="Section">
      </div>
    </div>
  </div>

  <!-- Teacher Information -->
  <div class="card">
    <div class="card-title">
      <i class="fas fa-user-tie"></i> Teacher Information
    </div>
    <div class="form-grid-4cols">
      <div class="form-group">
        <label><i class="fas fa-user"></i> Teacher Name <span class="req">*</span></label>
        <select class="form-control" id="teacherSelect" required onchange="fillTeacherDetails()">
          <option value="">-- Select Teacher --</option>
          <option value="Prof. Sarah Ahmed">Prof. Sarah Ahmed</option>
          <option value="Dr. Umar Farooq">Dr. Umar Farooq</option>
          <option value="Ms. Fatima Zafar">Ms. Fatima Zafar</option>
        </select>
      </div>
      <div class="form-group">
        <label><i class="fas fa-id-badge"></i> Teacher ID</label>
        <input type="text" class="form-control" id="teacherId" disabled placeholder="Auto-loaded">
      </div>
      <div class="form-group">
        <label><i class="fas fa-graduation-cap"></i> Qualification</label>
        <input type="text" class="form-control" id="teacherQualification" disabled placeholder="Qualification">
      </div>
      <div class="form-group">
        <label><i class="fas fa-book-open"></i> Subjects Can Teach</label>
        <input type="text" class="form-control" id="teacherSubjects" disabled placeholder="Subjects">
      </div>
    </div>
  </div>

  <!-- Attendance Details -->
  <div class="card">
    <div class="card-title">
      <i class="fas fa-calendar-check"></i> Attendance Details
    </div>
    
    <form id="attendanceForm">
      <div class="date-grid">
        <div class="form-group">
          <label><i class="fas fa-calendar-day"></i> Attendance Date <span class="req">*</span></label>
          <input type="date" class="form-control" id="attendanceDate" required>
        </div>
        <div></div>
      </div>

      <div class="btn-actions">
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-arrow-right"></i> Generate Roster
        </button>
        <button type="button" class="btn btn-secondary" id="resetBtn">
          <i class="fas fa-undo"></i> Reset
        </button>
        <a href="view-attendance-roster.html" class="btn btn-secondary" id="viewAttendanceBtn">
          <i class="fas fa-eye"></i> View Attendance Details
        </a>
        <a href="index.html" class="btn btn-secondary" id="backDashboardBtn">
          <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
      </div>
    </form>
  </div>
</main>
<script src="../components.js"></script>
<script>
  // Load Header and Sidebar
    function loadComponents() {
      fetch('header.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('header-placeholder').innerHTML = data;
        })
        .catch(err => console.error('Error loading header:', err));

      fetch('sidebar.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('sidebar-placeholder').innerHTML = data;
        })
        .catch(err => console.error('Error loading sidebar:', err));
    }

    window.onload = function() {
      loadComponents();
      
      setTimeout(() => {
        if (typeof window.initHeaderAndSidebar === 'function') {
          window.initHeaderAndSidebar();
        }
      }, 400);

      populateClassDropdown();
      populateTeacherDropdown();

      const attendanceDate = document.getElementById('attendanceDate');
      if (attendanceDate) {
        attendanceDate.value = new Date().toISOString().split('T')[0];
      }
    };

// ===== Storage Helpers =====
function loadFromStorage(key) {
  const stored = localStorage.getItem(key);
  return stored ? JSON.parse(stored) : [];
}
function saveToStorage(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}
function showToast(msg) {
  let t = document.createElement('div');
  t.className = 'toast-msg';
  t.innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2400);
}

function populateClassDropdown() {
  const select = document.getElementById('classSelect');
  const classes = loadFromStorage('messClasses');
  select.innerHTML = '<option value="">-- Select Class --</option>' +
    classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
}

function populateTeacherDropdown() {
  const select = document.getElementById('teacherSelect');
  const teachers = loadFromStorage('messTeachers');
  select.innerHTML = '<option value="">-- Select Teacher --</option>' +
    teachers.map(t => `<option value="${t.regNo}">${t.teacherName}</option>`).join('');
}

// Fill Class Details
function fillClassDetails() {
  const classId = document.getElementById('classSelect').value;
  const fields = {
    s_classId: document.getElementById('s_classId'),
    s_session: document.getElementById('s_session'),
    s_grade: document.getElementById('s_grade'),
    s_section: document.getElementById('s_section')
  };

  const cls = loadFromStorage('messClasses').find(c => c.id === classId);
  if (cls) {
    fields.s_classId.value = cls.id;
    fields.s_session.value = cls.session;
    fields.s_grade.value = cls.grade;
    fields.s_section.value = cls.section;
  } else {
    Object.values(fields).forEach(field => field.value = "");
  }
}

// Fill Teacher Details
function fillTeacherDetails() {
  const teacherRegNo = document.getElementById('teacherSelect').value;
  const teacherIdField = document.getElementById('teacherId');
  const qualField = document.getElementById('teacherQualification');
  const subjectsField = document.getElementById('teacherSubjects');

  const teacher = loadFromStorage('messTeachers').find(t => t.regNo === teacherRegNo);
  if (teacher) {
    teacherIdField.value = teacher.regNo;
    qualField.value = teacher.qualification || '';
    subjectsField.value = teacher.subjectsCanTeach || '';
  } else {
    teacherIdField.value = "";
    qualField.value = "";
    subjectsField.value = "";
  }
}

document.getElementById('attendanceForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const classId = document.getElementById('classSelect').value;
  const teacherRegNo = document.getElementById('teacherSelect').value;
  const date = document.getElementById('attendanceDate').value;

  const cls = loadFromStorage('messClasses').find(c => c.id === classId);
  const teacher = loadFromStorage('messTeachers').find(t => t.regNo === teacherRegNo);

  if (!cls || !teacher || !date) {
    showToast('⚠️ Please select class, teacher and date');
    return;
  }

  const rosters = loadFromStorage('messAttendanceRosters');

  const alreadyExists = rosters.some(r => r.classId === cls.id && r.teacherRegNo === teacher.regNo && r.date === date);
  if (alreadyExists) {
    showToast('⚠️ A roster already exists for this class, teacher and date');
    return;
  }

  rosters.push({
    id: 'ROSTER-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
    classId: cls.id,
    className: cls.name,
    session: cls.session,
    grade: cls.grade,
    section: cls.section,
    teacherRegNo: teacher.regNo,
    teacherName: teacher.teacherName,
    date: date,
    marked: false
  });

  saveToStorage('messAttendanceRosters', rosters);
  showToast(`✅ Roster generated for ${cls.name} on ${date} (Teacher: ${teacher.teacherName})`);
});

document.getElementById('resetBtn').addEventListener('click', function() {
  document.getElementById('attendanceForm').reset();
  document.getElementById('classSelect').value = '';
  document.getElementById('teacherSelect').value = '';
  fillClassDetails();
  fillTeacherDetails();
  document.getElementById('attendanceDate').value = new Date().toISOString().split('T')[0];
});

</script>
</body>
</html>
