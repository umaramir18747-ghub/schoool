<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEI – Assigned Subjects History</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="../responsive-components.css">
  <link rel="stylesheet" href="view-details.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="app-wrapper" id="appWrapper">
    <div id="sidebar-placeholder"></div>

    <main class="main-panel">
      <div class="page-header">
        <h1><i class="fas fa-layer-group"></i> Assigned Subjects History</h1>
        <p>Every subject-teacher assignment made from Assign Subjects, grouped by class</p>
      </div>

      <div class="card">
        <div class="card-title">
          <i class="fas fa-book-open"></i> Assigned Subjects
          <span class="record-count-badge" id="recordCountBadge">0</span>
        </div>

        <!-- ===== Filter Tabs ===== -->
        <div class="filter-tabs" id="filterTabs">
          <button class="filter-tab active" data-filter="all" onclick="setFilter('all')">
            <i class="fas fa-th-list"></i> All
            <span class="badge" id="allCount">0</span>
          </button>
          <button class="filter-tab" data-filter="regular" onclick="setFilter('regular')">
            <i class="fas fa-school"></i> Regular
            <span class="badge" id="regularCount">0</span>
          </button>
          <button class="filter-tab" data-filter="makeup" onclick="setFilter('makeup')">
            <i class="fas fa-calendar-plus"></i> Make-Up
            <span class="badge" id="makeupCount">0</span>
          </button>
        </div>

        <!-- ===== Search ===== -->
        <div class="search-wrap">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Search by class, subject, teacher, or class type…" oninput="applyFilters()">
          <button class="search-clear-btn" id="clearSearchBtn" style="display:none;" onclick="clearSearch()">
            <i class="fas fa-times-circle"></i>
          </button>
        </div>

        <div id="subjectsContainer"></div>
      </div>
    </main>
  </div>

  <!-- ===== Delete Confirmation Modal ===== -->
  <div class="delete-modal-overlay" id="deleteModal">
    <div class="delete-modal">
      <h3><i class="fas fa-exclamation-triangle" style="color:#dc2626;"></i> Remove Subject Assignment</h3>
      <p id="deleteModalMessage">Are you sure you want to remove this subject assignment?</p>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn-danger" id="confirmDeleteBtn">Remove Subject</button>
      </div>
    </div>
  </div>

  <script src="../components.js"></script>
  <script>
    // ===== Global State =====
    let currentFilter = 'all';
    let pendingDelete = null;

    // ===== Load Components =====
    function loadComponents() {
      fetch('header.html').then(r => r.text()).then(data => document.getElementById('header-placeholder').innerHTML = data);
      fetch('sidebar.html').then(r => r.text()).then(data => document.getElementById('sidebar-placeholder').innerHTML = data);
    }

    window.onload = function() {
      loadComponents();
      setTimeout(() => { if (typeof window.initHeaderAndSidebar === 'function') window.initHeaderAndSidebar(); }, 400);
      applyFilters();
    };

    // ===== Storage Helpers =====
    function loadFromStorage(key) {
      const stored = localStorage.getItem(key);
      return stored ? JSON.parse(stored) : [];
    }

    function saveToStorage(key, data) {
      localStorage.setItem(key, JSON.stringify(data));
    }

    function showToast(msg, type = 'info') {
      let t = document.createElement('div');
      t.className = 'toast-msg';
      const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
      t.innerHTML = `<i class="fas ${icon}"></i> ${msg}`;
      t.style.borderLeftColor = type === 'success' ? '#16a34a' : type === 'error' ? '#dc2626' : '#2563eb';
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2400);
    }

    // ===== Filter Functions =====
    function setFilter(filter) {
      currentFilter = filter;
      
      document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.classList.remove('active');
        if (tab.dataset.filter === filter) {
          tab.classList.add('active');
        }
      });
      
      applyFilters();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').style.display = 'none';
      applyFilters();
    }

    function applyFilters() {
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      const clearBtn = document.getElementById('clearSearchBtn');
      
      if (search) {
        clearBtn.style.display = 'inline-block';
      } else {
        clearBtn.style.display = 'none';
      }
      
      let records = loadFromStorage('messSubjects');

      if (currentFilter === 'regular') {
        records = records.filter(r => r.classType === 'regular');
      } else if (currentFilter === 'makeup') {
        records = records.filter(r => r.classType === 'makeup');
      }

      if (search) {
        records = records.filter(r =>
          r.className.toLowerCase().includes(search) ||
          r.subjectName.toLowerCase().includes(search) ||
          r.teacherName.toLowerCase().includes(search) ||
          (r.classType && r.classType.toLowerCase().includes(search)) ||
          r.classId.toLowerCase().includes(search)
        );
      }

      renderGroupedSubjects(records);
      updateTabCounts();
    }

    // ===== Update Tab Counts =====
    function updateTabCounts() {
      const allSubjects = loadFromStorage('messSubjects');
      document.getElementById('allCount').textContent = allSubjects.length;
      document.getElementById('regularCount').textContent = allSubjects.filter(r => r.classType === 'regular').length;
      document.getElementById('makeupCount').textContent = allSubjects.filter(r => r.classType === 'makeup').length;
    }

    // ===== Render Grouped Subjects =====
    function renderGroupedSubjects(records) {
      const container = document.getElementById('subjectsContainer');
      document.getElementById('recordCountBadge').textContent = records.length;

      if (records.length === 0) {
        const message = currentFilter === 'regular' ? 'No regular class subject assignments found.' :
                       currentFilter === 'makeup' ? 'No make-up class subject assignments found.' :
                       'No subject assignments found. Start by assigning subjects from the Assign Subjects page.';
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-inbox"></i>
            <p>${message}</p>
            <a href="assign-subjects.html" class="btn btn-primary" style="display:inline-block;margin-top:12px;padding:8px 24px;border-radius:0;background:#2563eb;color:white;text-decoration:none;font-weight:600;">
              <i class="fas fa-plus"></i> Assign Subjects
            </a>
          </div>
        `;
        return;
      }

      // Group records by classId
      const grouped = {};
      records.forEach(r => {
        if (!grouped[r.classId]) {
          grouped[r.classId] = {
            className: r.className,
            classId: r.classId,
            classType: r.classType || 'regular',
            grade: r.grade || '—',
            section: r.section || '—',
            session: r.session || '—',
            subjects: []
          };
        }
        grouped[r.classId].subjects.push(r);
      });

      // Sort: Regular classes first, then makeup
      const sortedGroups = Object.values(grouped).sort((a, b) => {
        if (a.classType === b.classType) return a.className.localeCompare(b.className);
        return a.classType === 'regular' ? -1 : 1;
      });

      container.innerHTML = sortedGroups.map((group) => {
        const isMakeup = group.classType === 'makeup';
        const badgeLabel = isMakeup ? 'Make-Up' : 'Regular';

        return `
          <details class="slip-accordion">
            <summary>
              <div class="summary-left">
                <i class="fas fa-layer-group slip-icon"></i>
                <div>
                  <h3>
                    ${group.className}
                    <span style="color:#94a3b8;font-weight:600;font-size:14px;">(${group.classId})</span>
                  </h3>
                  <div class="class-meta">
                    Grade ${group.grade} · Section ${group.section} · Session ${group.session}
                    <span class="class-type-badge ${isMakeup ? 'makeup' : 'regular'}">${badgeLabel}</span>
                  </div>
                </div>
              </div>
              <div class="summary-right">
                <span class="subject-count">
                  <i class="fas fa-book-open"></i> ${group.subjects.length} subject${group.subjects.length > 1 ? 's' : ''}
                </span>
                <i class="fas fa-chevron-down chevron"></i>
              </div>
            </summary>
            <div class="table-wrapper">
              <table class="exam-table">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Subject</th>
                    <th>Teacher</th>
                    <th style="text-align:center;">Action</th>
                  </tr>
                </thead>
                <tbody>
                  ${group.subjects.map((sub, subIdx) => `
                    <tr>
                      <td style="color:#94a3b8;font-size:13px;width:40px;">${subIdx + 1}</td>
                      <td><strong>${sub.subjectName}</strong></td>
                      <td><i class="fas fa-user-tie" style="color:#64748b;font-size:12px;"></i> ${sub.teacherName}</td>
                      <td style="text-align:center;">
                        <i class="fas fa-trash-alt exam-delete-icon" 
                           data-classid="${group.classId}" 
                           data-subjectname="${sub.subjectName}" 
                           data-teachername="${sub.teacherName}"
                           data-classname="${group.className}"
                           style="cursor:pointer;color:#94a3b8;transition:color 0.2s;"
                           onmouseover="this.style.color='#dc2626'" 
                           onmouseout="this.style.color='#94a3b8'"
                           title="Delete this subject assignment"></i>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </details>
        `;
      }).join('');

      // Attach delete event listeners
      document.querySelectorAll('.exam-delete-icon').forEach(icon => {
        icon.addEventListener('click', () => {
          const classId = icon.dataset.classid;
          const subjectName = icon.dataset.subjectname;
          const teacherName = icon.dataset.teachername;
          const className = icon.dataset.classname;
          openDeleteModal(classId, subjectName, teacherName, className);
        });
      });
    }

    // ===== Delete Modal =====
    function openDeleteModal(classId, subjectName, teacherName, className) {
      pendingDelete = { classId, subjectName, teacherName };
      document.getElementById('deleteModalMessage').textContent = 
        `Are you sure you want to remove "${subjectName}" (${teacherName}) from "${className}"?`;
      document.getElementById('deleteModal').classList.add('active');
    }

    function closeDeleteModal() {
      document.getElementById('deleteModal').classList.remove('active');
      pendingDelete = null;
    }

    function confirmDelete() {
      if (!pendingDelete) return;
      
      const { classId, subjectName, teacherName } = pendingDelete;
      const records = loadFromStorage('messSubjects');
      
      const updated = records.filter(r => 
        !(r.classId === classId && 
          r.subjectName === subjectName && 
          r.teacherName === teacherName)
      );
      
      if (updated.length === records.length) {
        showToast('⚠️ Subject assignment not found', 'error');
        closeDeleteModal();
        return;
      }
      
      saveToStorage('messSubjects', updated);
      showToast(`✅ Removed "${subjectName}" from class`, 'success');
      closeDeleteModal();
      applyFilters();
    }

    // Modal event listeners
    document.getElementById('confirmDeleteBtn').addEventListener('click', confirmDelete);
    document.getElementById('deleteModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('deleteModal')) closeDeleteModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.getElementById('deleteModal').classList.contains('active')) closeDeleteModal();
    });

    // ===== Search input keyboard shortcut =====
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
    });

    // ===== Keyboard shortcut hint =====
    console.log('💡 Tip: Press Ctrl+K to focus search');
  </script>
</body>
</html>
