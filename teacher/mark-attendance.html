<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEI – Mark Attendance</title>
  <link rel="icon" type="image/png" href="../logo2.png">
  <!-- Font Awesome (optional but used in UI) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- external CSS -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="../responsive-components.css">
</head>
<body>
  <!-- Header & Sidebar are injected via JS (components) -->
  <div id="header-placeholder"></div>
  <div class="app-wrapper" id="appWrapper">
    <div id="sidebar-placeholder"></div>

    <main class="main-panel">
      <div class="page-header">
        <h1><i class="fas fa-clipboard-check" style="color:#2563eb;"></i> Mark Attendance</h1>
        <p>Open a class below to mark or review student attendance</p>
      </div>

      <div class="card">
        <div class="card-title">
          <i class="fas fa-chalkboard"></i> Your Classes
        </div>
        <!-- dynamic classes grid injected by JS -->
        <div class="classes-grid" id="classesGrid"></div>

        <!-- hidden panels for student lists (dummy removed, everything is generated from storage) -->
        <div class="students-panel" id="panel-a" style="display:none;"></div>
        <div class="students-panel" id="panel-b" style="display:none;"></div>
        <div class="students-panel" id="panel-c" style="display:none;"></div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="attendanceModal">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <h2><i class="fas fa-users"></i> <span id="modalTitle">Student List</span></h2>
          <div class="sub" id="modalSub">Class ID · Date</div>
        </div>
        <button class="modal-close" onclick="closeAttendanceModal()"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- external JS (components.js must exist for header/sidebar) -->
  <script src="../components.js"></script>
  <script src="mark-attendance.js"></script>
</body>
</html>
