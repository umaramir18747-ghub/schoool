<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEI – Attendance Records History</title>
  <link rel="icon" type="image/png" href="../logo2.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="../responsive-components.css">
  <link rel="stylesheet" href="view-details.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="app-wrapper" id="appWrapper">
    <div id="sidebar-placeholder"></div>

    <main class="main-panel">
      <div class="page-header">
        <h1><i class="fas fa-history" style="color:#2563eb;"></i> Attendance Records History</h1>
        <p>View attendance records marked by you, grouped by class and date.</p>
      </div>

      <div class="card">
        <div class="card-title">
          <i class="fas fa-clipboard-check"></i> My Attendance Records
          <span id="recordCountBadge" style="background:#eff6ff;color:#2563eb;font-size:13px;font-weight:700;padding:3px 11px;margin-left:8px;border:1px solid #dbeafe;">0</span>
        </div>

        <div class="search-wrap">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Search by class or student…" oninput="applyFilters()">
        </div>

        <div id="recordsContainer"></div>
      </div>
    </main>
  </div>

  <script src="../components.js"></script>
  <script>
    // ===== Session Guard =====
    function requireTeacherSession() {
      const stored = localStorage.getItem('messCurrentUser');
      const session = stored ? JSON.parse(stored) : null;
      if (!session || session.role !== 'teacher') {
        window.location.href = 'login.html';
        return false;
      }
      return true;
    }

    function loadComponents() {
      fetch('header.html').then(r => r.text()).then(data => document.getElementById('header-placeholder').innerHTML = data);
      fetch('sidebar.html').then(r => r.text()).then(data => document.getElementById('sidebar-placeholder').innerHTML = data);
    }

    window.onload = function() {
      if (!requireTeacherSession()) return;
      
      loadComponents();
      setTimeout(() => { 
        if (typeof window.initHeaderAndSidebar === 'function') window.initHeaderAndSidebar(); 
      }, 400);
      
      applyFilters();
    };

    // ===== Storage Helpers =====
    function loadFromStorage(key) {
      const stored = localStorage.getItem(key);
      return stored ? JSON.parse(stored) : [];
    }
    function saveToStorage(key, data) {
      localStorage.setItem(key, JSON.stringify(data));
    }
    function showToast(msg) {
      let t = document.createElement('div');
      t.className = 'toast-msg';
      t.innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2400);
    }

    function formatDisplayDate(dateStr) {
      if (!dateStr) return '—';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    // Extract time from record ID (timestamp is at position 1)
    function extractTimeFromId(id) {
      const parts = id.split('-');
      if (parts.length >= 2 && !isNaN(parts[1])) {
        const timestamp = parseInt(parts[1]);
        const date = new Date(timestamp);
        return date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      }
      return '—';
    }

    // Format full date and time for "Last Marked"
    function formatLastMarked(id) {
      const parts = id.split('-');
      if (parts.length >= 2 && !isNaN(parts[1])) {
        const timestamp = parseInt(parts[1]);
        const date = new Date(timestamp);
        const timeStr = date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        return timeStr;
      }
      return '—';
    }

    function getCurrentTeacherRegNo() {
      const session = JSON.parse(localStorage.getItem('messCurrentUser'));
      return session ? session.regNo : null;
    }

    function applyFilters() {
      const teacherRegNo = getCurrentTeacherRegNo();
      if (!teacherRegNo) return;

      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      
      // Get only records marked by the current teacher
      let records = loadFromStorage('messAttendanceRecords')
        .filter(r => r.markedByRegNo === teacherRegNo)
        .sort((a, b) => new Date(b.date) - new Date(a.date));

      if (search) {
        records = records.filter(r =>
          r.studentName.toLowerCase().includes(search) ||
          r.regNo.toLowerCase().includes(search) ||
          r.className.toLowerCase().includes(search)
        );
      }

      renderGroupedRecords(records);
    }

    function renderGroupedRecords(records) {
      const container = document.getElementById('recordsContainer');
      document.getElementById('recordCountBadge').textContent = records.length;

      if (records.length === 0) {
        container.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>No attendance records found.</p></div>`;
        return;
      }

      // Group records by classId and date
      const grouped = {};
      records.forEach(r => {
        const key = r.classId + '|' + r.date;
        if (!grouped[key]) {
          grouped[key] = {
            classId: r.classId,
            className: r.className,
            date: r.date,
            records: []
          };
        }
        grouped[key].records.push(r);
      });

      container.innerHTML = Object.values(grouped).map((group, idx) => {
        const total = group.records.length;
        const present = group.records.filter(r => r.status === 'Present').length;
        const absent = total - present;
        const presentPct = total > 0 ? Math.round((present / total) * 100) : 0;
        
        // Get the latest marked time from all records in this group
        const latestRecord = group.records.reduce((latest, current) => {
          const latestTime = parseInt(latest.id.split('-')[1] || 0);
          const currentTime = parseInt(current.id.split('-')[1] || 0);
          return currentTime > latestTime ? current : latest;
        }, group.records[0]);
        
        const lastMarkedTime = formatLastMarked(latestRecord.id);
        
        return `
          <details class="slip-accordion">
            <summary>
              <div class="summary-left">
                <i class="fas fa-clipboard-list slip-icon" style="color:#2563eb;"></i>
                <div>
                  <h3>${group.className} <span style="color:#94a3b8;font-weight:600;">(${group.classId})</span></h3>
                  <span>${formatDisplayDate(group.date)} · 
                    <span style="color:#22c55e;">${present} present</span> · 
                    <span style="color:#ef4444;">${absent} absent</span>
                    <span style="color:#64748b;font-weight:600;">(${presentPct}% present)</span>
                  </span>
                </div>
              </div>
              <div class="summary-right">
                <span style="font-size:13px; color:#64748b; display:flex; align-items:center; gap:6px;">
                  <i class="fas fa-clock" style="color:#2563eb;"></i> Last marked: ${lastMarkedTime}
                </span>
                <i class="fas fa-chevron-down chevron"></i>
              </div>
            </summary>
            <div class="table-wrapper">
              <table class="exam-table">
                <thead>
                  <tr>
                    <th>Student Name</th>
                    <th>Reg No</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody>
                  ${group.records.map((r, recordIdx) => {
                    const statusClass = r.status === 'Present' ? 'status-active' : 'status-inactive';
                    const statusIcon = r.status === 'Present' ? 'fa-check-circle' : 'fa-times-circle';
                    
                    return `
                      <tr>
                        <td><strong>${r.studentName}</strong></td>
                        <td>${r.regNo}</td>
                        <td><span class="status-badge ${statusClass}"><i class="fas ${statusIcon}"></i> ${r.status}</span></td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </details>
        `;
      }).join('');
    }
  </script>
</body>
</html>
