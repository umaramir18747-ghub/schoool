<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEI – Results History</title>
   <link rel="icon" type="image/png" href="../logo2.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="../responsive-components.css">
  <link rel="stylesheet" href="view-details.css">
  <style>
    /* Additional styles for filter dropdowns */
    .filter-section {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      padding: 16px 20px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      align-items: flex-end;
    }
    
    .filter-group {
      flex: 1;
      min-width: 180px;
    }
    
    .filter-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 4px;
    }
    
    .filter-group select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 14px;
      background: white;
      color: #1e293b;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    
    .filter-group select:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    
    .filter-group select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .filter-reset-btn {
      padding: 8px 16px;
      background: #e2e8f0;
      border: none;
      border-radius: 6px;
      color: #475569;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    
    .filter-reset-btn:hover {
      background: #cbd5e1;
    }

    /* Edit button styles */
    .edit-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    
    .edit-btn:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }
    
    .edit-btn i {
      font-size: 11px;
    }

    /* Edit mode styles */
    .marks-input-edit {
      width: 80px;
      padding: 4px 8px;
      border: 2px solid #2563eb;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
      background: #f0f7ff;
    }
    
    .marks-input-edit:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }
    
    .save-edit-btn {
      background: #22c55e;
      color: white;
      border: none;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-left: 6px;
    }
    
    .save-edit-btn:hover {
      background: #16a34a;
    }
    
    .cancel-edit-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-left: 4px;
    }
    
    .cancel-edit-btn:hover {
      background: #dc2626;
    }

    .marks-display {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .marks-num {
      font-weight: 600;
      color: #1e293b;
    }

    .action-icons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      align-items: center;
    }

    @media (max-width: 768px) {
      .filter-section {
        flex-direction: column;
        gap: 12px;
      }
      
      .filter-group {
        min-width: 100%;
      }
      
      .filter-reset-btn {
        width: 100%;
        justify-content: center;
      }
      
      .edit-btn {
        padding: 4px 10px;
        font-size: 11px;
      }
      
      .marks-input-edit {
        width: 60px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="app-wrapper" id="appWrapper">
    <div id="sidebar-placeholder"></div>

    <main class="main-panel">
      <div class="page-header">
        <h1><i class="fas fa-chart-bar" style="color:#2563eb;"></i> Results History</h1>
        <p>View test and paper results entered by you, filtered by class, subject and assessment.</p>
      </div>

      <div class="card">
        <div class="card-title">
          <i class="fas fa-clipboard-list"></i> My Results
          <span id="recordCountBadge" style="background:#eff6ff;color:#2563eb;font-size:13px;font-weight:700;padding:3px 11px;margin-left:8px;border:1px solid #dbeafe;">0</span>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
          <div class="filter-group">
            <label><i class="fas fa-chalkboard"></i> Class</label>
            <select id="classFilter" onchange="onClassChange()">
              <option value="">-- All Classes --</option>
            </select>
          </div>
          
          <div class="filter-group">
            <label><i class="fas fa-book"></i> Subject</label>
            <select id="subjectFilter" onchange="onSubjectChange()" disabled>
              <option value="">-- Select Class First --</option>
            </select>
          </div>
          
          <div class="filter-group">
            <label><i class="fas fa-file-alt"></i> Assessment</label>
            <select id="assessmentFilter" onchange="onAssessmentChange()" disabled>
              <option value="">-- Select Subject First --</option>
            </select>
          </div>
          
          <div class="filter-group" style="flex: 0 0 auto;">
            <button class="filter-reset-btn" onclick="resetFilters()">
              <i class="fas fa-undo"></i> Reset
            </button>
          </div>
        </div>

        <div id="resultsContainer"></div>
      </div>
    </main>
  </div>

  <script src="../components.js"></script>
  <script>
    // ===== Session Guard =====
    function requireTeacherSession() {
      const stored = localStorage.getItem('messCurrentUser');
      const session = stored ? JSON.parse(stored) : null;
      if (!session || session.role !== 'teacher') {
        window.location.href = 'login.html';
        return false;
      }
      return true;
    }

    function loadComponents() {
      fetch('header.html').then(r => r.text()).then(data => document.getElementById('header-placeholder').innerHTML = data);
      fetch('sidebar.html').then(r => r.text()).then(data => document.getElementById('sidebar-placeholder').innerHTML = data);
    }

    window.onload = function() {
      if (!requireTeacherSession()) return;
      
      loadComponents();
      setTimeout(() => { 
        if (typeof window.initHeaderAndSidebar === 'function') window.initHeaderAndSidebar(); 
      }, 400);
      
      populateFilters();
      applyFilters();
    };

    // ===== Storage Helpers =====
    function loadFromStorage(key) {
      const stored = localStorage.getItem(key);
      return stored ? JSON.parse(stored) : [];
    }
    function saveToStorage(key, data) {
      localStorage.setItem(key, JSON.stringify(data));
    }
    function showToast(msg) {
      let t = document.createElement('div');
      t.className = 'toast-msg';
      t.innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2400);
    }

    function calculatePercentage(obtained, total) {
      if (!total || total === 0) return 0;
      return Math.round((obtained / total) * 100);
    }

    function getCurrentTeacherRegNo() {
      const session = JSON.parse(localStorage.getItem('messCurrentUser'));
      return session ? session.regNo : null;
    }

    // ===== Filter State =====
    let allResults = [];
    let filterState = {
      classId: '',
      subjectName: '',
      assessmentName: ''
    };

    // ===== Populate Filters =====
    function populateFilters() {
      const teacherRegNo = getCurrentTeacherRegNo();
      if (!teacherRegNo) return;

      allResults = loadFromStorage('messResults')
        .filter(r => r.teacherRegNo === teacherRegNo);

      // Get unique classes
      const classes = [...new Set(allResults.map(r => r.classId))].sort();
      const classSelect = document.getElementById('classFilter');
      classSelect.innerHTML = '<option value="">-- All Classes --</option>';
      classes.forEach(cls => {
        classSelect.innerHTML += `<option value="${cls}">${cls}</option>`;
      });

      // Reset dependent dropdowns
      document.getElementById('subjectFilter').innerHTML = '<option value="">-- Select Class First --</option>';
      document.getElementById('subjectFilter').disabled = true;
      document.getElementById('assessmentFilter').innerHTML = '<option value="">-- Select Subject First --</option>';
      document.getElementById('assessmentFilter').disabled = true;
    }

    // ===== On Class Change =====
    window.onClassChange = function() {
      const classId = document.getElementById('classFilter').value;
      filterState.classId = classId;
      
      const subjectSelect = document.getElementById('subjectFilter');
      const assessmentSelect = document.getElementById('assessmentFilter');
      
      if (!classId) {
        subjectSelect.innerHTML = '<option value="">-- Select Class First --</option>';
        subjectSelect.disabled = true;
        assessmentSelect.innerHTML = '<option value="">-- Select Subject First --</option>';
        assessmentSelect.disabled = true;
        filterState.subjectName = '';
        filterState.assessmentName = '';
        applyFilters();
        return;
      }

      // Get unique subjects for this class
      const subjects = [...new Set(
        allResults
          .filter(r => r.classId === classId)
          .map(r => r.subjectName)
      )].sort();

      subjectSelect.innerHTML = '<option value="">-- All Subjects --</option>';
      subjects.forEach(sub => {
        subjectSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
      });
      subjectSelect.disabled = false;
      
      // Reset assessment dropdown
      assessmentSelect.innerHTML = '<option value="">-- Select Subject First --</option>';
      assessmentSelect.disabled = true;
      filterState.subjectName = '';
      filterState.assessmentName = '';
      
      applyFilters();
    };

    // ===== On Subject Change =====
    window.onSubjectChange = function() {
      const classId = document.getElementById('classFilter').value;
      const subjectName = document.getElementById('subjectFilter').value;
      filterState.subjectName = subjectName;
      
      const assessmentSelect = document.getElementById('assessmentFilter');
      
      if (!classId || !subjectName) {
        assessmentSelect.innerHTML = '<option value="">-- Select Subject First --</option>';
        assessmentSelect.disabled = true;
        filterState.assessmentName = '';
        applyFilters();
        return;
      }

      // Get unique assessments (test/paper names) for this class + subject
      const assessments = [...new Set(
        allResults
          .filter(r => r.classId === classId && r.subjectName === subjectName)
          .map(r => r.name)
      )].sort();

      assessmentSelect.innerHTML = '<option value="">-- All Assessments --</option>';
      assessments.forEach(ass => {
        assessmentSelect.innerHTML += `<option value="${ass}">${ass}</option>`;
      });
      assessmentSelect.disabled = false;
      filterState.assessmentName = '';
      
      applyFilters();
    };

    // ===== On Assessment Change =====
    window.onAssessmentChange = function() {
      filterState.assessmentName = document.getElementById('assessmentFilter').value;
      applyFilters();
    };

    // ===== Reset Filters =====
    window.resetFilters = function() {
      document.getElementById('classFilter').value = '';
      document.getElementById('subjectFilter').innerHTML = '<option value="">-- Select Class First --</option>';
      document.getElementById('subjectFilter').disabled = true;
      document.getElementById('assessmentFilter').innerHTML = '<option value="">-- Select Subject First --</option>';
      document.getElementById('assessmentFilter').disabled = true;
      
      filterState = {
        classId: '',
        subjectName: '',
        assessmentName: ''
      };
      
      applyFilters();
    };

    // ===== Apply Filters =====
    function applyFilters() {
      const teacherRegNo = getCurrentTeacherRegNo();
      if (!teacherRegNo) return;

      let filtered = allResults;

      // Apply class filter
      if (filterState.classId) {
        filtered = filtered.filter(r => r.classId === filterState.classId);
      }

      // Apply subject filter
      if (filterState.subjectName) {
        filtered = filtered.filter(r => r.subjectName === filterState.subjectName);
      }

      // Apply assessment filter
      if (filterState.assessmentName) {
        filtered = filtered.filter(r => r.name === filterState.assessmentName);
      }

      // Sort by date (newest first)
      filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

      renderGroupedResults(filtered);
    }

    // ===== Edit Marks Function =====
    window.editMarks = function(resultId) {
      const results = loadFromStorage('messResults');
      const result = results.find(r => r.id === resultId);
      if (!result) {
        showToast('⚠️ Result not found');
        return;
      }

      // Verify teacher owns this result
      const teacherRegNo = getCurrentTeacherRegNo();
      if (result.teacherRegNo !== teacherRegNo) {
        showToast('⚠️ You can only edit results you entered');
        return;
      }

      // Find the row and replace with edit mode
      const row = document.querySelector(`tr[data-result-id="${resultId}"]`);
      if (!row) return;

      const marksCell = row.querySelector('.marks-cell');
      const actionCell = row.querySelector('.action-cell');
      
      // Store current values
      const currentObtained = result.obtained;
      const totalMarks = result.total;

      // Replace marks cell with input
      marksCell.innerHTML = `
        <div class="marks-display">
          <input type="number" class="marks-input-edit" id="editMarks_${resultId}" value="${currentObtained}" min="0" max="${totalMarks}" step="1">
          <span style="color:#94a3b8;font-weight:600;">/ ${totalMarks}</span>
        </div>
      `;

      // Replace action cell with save/cancel buttons
      actionCell.innerHTML = `
        <div class="action-icons">
          <button class="save-edit-btn" onclick="saveMarks('${resultId}')">
            <i class="fas fa-check"></i> Save
          </button>
          <button class="cancel-edit-btn" onclick="cancelEdit('${resultId}')">
            <i class="fas fa-times"></i> Cancel
          </button>
        </div>
      `;

      // Focus the input
      const input = document.getElementById(`editMarks_${resultId}`);
      if (input) {
        input.focus();
        input.select();
      }
    };

    // ===== Save Edited Marks =====
    window.saveMarks = function(resultId) {
      const input = document.getElementById(`editMarks_${resultId}`);
      if (!input) return;

      const newObtained = parseFloat(input.value);
      
      if (isNaN(newObtained) || newObtained < 0) {
        showToast('⚠️ Please enter a valid number (0 or greater)');
        return;
      }

      const results = loadFromStorage('messResults');
      const resultIndex = results.findIndex(r => r.id === resultId);
      
      if (resultIndex === -1) {
        showToast('⚠️ Result not found');
        return;
      }

      const result = results[resultIndex];
      
      // Check if new marks exceed total
      if (newObtained > result.total) {
        showToast(`⚠️ Marks cannot exceed ${result.total}`);
        return;
      }

      // Update the marks
      result.obtained = newObtained;
      results[resultIndex] = result;
      saveToStorage('messResults', results);

      showToast('✅ Marks updated successfully!');
      
      // Refresh the display
      allResults = loadFromStorage('messResults').filter(r => r.teacherRegNo === getCurrentTeacherRegNo());
      applyFilters();
    };

    // ===== Cancel Edit =====
    window.cancelEdit = function(resultId) {
      // Just refresh the display
      applyFilters();
    };

    // ===== Render Grouped Results =====
    function renderGroupedResults(results) {
      const container = document.getElementById('resultsContainer');
      document.getElementById('recordCountBadge').textContent = results.length;

      if (results.length === 0) {
        container.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>No results found for the selected filters.</p></div>`;
        return;
      }

      // Group results by classId, assessment name, type, and date
      const grouped = {};
      results.forEach(r => {
        const key = r.classId + '|' + r.name + '|' + r.type + '|' + r.date;
        if (!grouped[key]) {
          grouped[key] = {
            classId: r.classId,
            assessmentName: r.name,
            type: r.type,
            date: r.date,
            results: []
          };
        }
        grouped[key].results.push(r);
      });

      container.innerHTML = Object.values(grouped).map((group, idx) => {
        const total = group.results.length;
        const totalMarks = group.results.reduce((sum, r) => sum + r.obtained, 0);
        const maxMarks = group.results.reduce((sum, r) => sum + r.total, 0);
        const avgPct = maxMarks > 0 ? Math.round((totalMarks / maxMarks) * 100) : 0;
        
        const typeIcon = group.type === 'test' ? 'fa-pen' : 'fa-file-lines';
        const typeClass = group.type === 'test' ? 'type-test' : 'type-paper';
        
        return `
          <details class="slip-accordion">
            <summary>
              <div class="summary-left">
                <i class="fas ${typeIcon} slip-icon" style="color:#2563eb;"></i>
                <div>
                  <h3>${group.assessmentName} <span style="color:#94a3b8;font-weight:600;">(${group.classId})</span></h3>
                  <span>
                    <span class="type-badge ${typeClass}" style="font-size:12px;padding:2px 10px;margin-right:8px;border-radius:4px;">
                      <i class="fas ${typeIcon}"></i> ${group.type}
                    </span>
                    ${group.date} · 
                    <span style="color:#2563eb;font-weight:600;">${total} students</span> · 
                    <span style="color:#22c55e;">${avgPct}% average</span>
                  </span>
                </div>
              </div>
              <div class="summary-right">
                <button type="button" class="delete-slip-btn" data-classid="${group.classId}" data-name="${group.assessmentName}" data-type="${group.type}" data-date="${group.date}">
                  <i class="fas fa-trash-alt"></i> Delete All
                </button>
                <i class="fas fa-chevron-down chevron"></i>
              </div>
            </summary>
            <div class="table-wrapper">
              <table class="exam-table">
                <thead>
                  <tr>
                    <th>Student Name</th>
                    <th>Reg No</th>
                    <th>Marks</th>
                    <th>Percentage</th>
                    <th style="text-align:right">Action</th>
                  </tr>
                </thead>
                <tbody>
                  ${group.results.map((r, resultIdx) => {
                    const pct = calculatePercentage(r.obtained, r.total);
                    const pctClass = pct >= 80 ? 'high' : pct >= 60 ? 'medium' : 'low';
                    
                    return `
                      <tr data-result-id="${r.id}">
                        <td><strong>${r.studentName}</strong></td>
                        <td>${r.regNo}</td>
                        <td class="marks-cell">
                          <div class="marks-display">
                            <span class="marks-num">${r.obtained}/${r.total}</span>
                          </div>
                        </td>
                        <td>
                          <span class="pct-badge pct-${pctClass}">${pct}%</span>
                        </td>
                        <td class="action-cell" style="text-align:right">
                          <div class="action-icons">
                            <button class="edit-btn" onclick="editMarks('${r.id}')">
                              <i class="fas fa-pen"></i> Edit
                            </button>
                          </div>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </details>
        `;
      }).join('');

      // Delete entire group
      document.querySelectorAll('.delete-slip-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          deleteEntireGroup(
            btn.dataset.classid, 
            btn.dataset.name, 
            btn.dataset.type, 
            btn.dataset.date
          );
        });
      });
    }

    // ===== Delete Functions =====
    function deleteEntireGroup(classId, assessmentName, type, date) {
      const teacherRegNo = getCurrentTeacherRegNo();
      if (!teacherRegNo) return;

      const results = loadFromStorage('messResults');
      const groupResults = results.filter(r => 
        r.classId === classId && 
        r.name === assessmentName &&
        r.type === type &&
        r.date === date && 
        r.teacherRegNo === teacherRegNo
      );
      
      if (groupResults.length === 0) return;

      if (!confirm(`Delete all ${groupResults.length} results for "${assessmentName}" (${type}) in ${classId} on ${date}?`)) return;

      const updated = results.filter(r => 
        !(r.classId === classId && 
          r.name === assessmentName &&
          r.type === type &&
          r.date === date && 
          r.teacherRegNo === teacherRegNo)
      );
      saveToStorage('messResults', updated);
      showToast(`🗑️ All ${groupResults.length} results deleted for "${assessmentName}"`);
      
      // Refresh all results and filters
      allResults = loadFromStorage('messResults').filter(r => r.teacherRegNo === teacherRegNo);
      applyFilters();
    }
  </script>
</body>
</html>
