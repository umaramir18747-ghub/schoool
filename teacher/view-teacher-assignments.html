<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEI – Assignments History</title>
   <link rel="icon" type="image/png" href="../logo2.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="../responsive-components.css">
  <link rel="stylesheet" href="view-details.css">
  <style>
    /* Additional styles for filter dropdowns */
    .filter-section {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      padding: 16px 20px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      align-items: flex-end;
    }
    
    .filter-group {
      flex: 1;
      min-width: 180px;
    }
    
    .filter-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 4px;
    }
    
    .filter-group select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 14px;
      background: white;
      color: #1e293b;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    
    .filter-group select:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    
    .filter-group select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .filter-reset-btn {
      padding: 8px 16px;
      background: #e2e8f0;
      border: none;
      border-radius: 6px;
      color: #475569;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    
    .filter-reset-btn:hover {
      background: #cbd5e1;
    }
    
    .search-wrap {
      padding: 12px 20px;
      border-bottom: 1px solid #e2e8f0;
    }
    
    .search-wrap input {
      width: 100%;
      padding: 8px 12px 8px 36px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 14px;
      background: white;
      transition: border-color 0.2s;
    }
    
    .search-wrap input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    
    .search-wrap {
      position: relative;
    }
    
    .search-wrap .fa-search {
      position: absolute;
      left: 32px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
    }
    
    @media (max-width: 768px) {
      .filter-section {
        flex-direction: column;
        gap: 12px;
      }
      
      .filter-group {
        min-width: 100%;
      }
      
      .filter-reset-btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="app-wrapper" id="appWrapper">
    <div id="sidebar-placeholder"></div>

    <main class="main-panel">
      <div class="page-header">
        <h1><i class="fas fa-file-pen" style="color:#2563eb;"></i> Assignments History</h1>
        <p>View assignments posted by you, filtered by class and subject.</p>
      </div>

      <div class="card">
        <div class="card-title">
          <i class="fas fa-tasks"></i> My Assignments
          <span id="recordCountBadge" style="background:#eff6ff;color:#2563eb;font-size:13px;font-weight:700;padding:3px 11px;margin-left:8px;border:1px solid #dbeafe;">0</span>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
          <div class="filter-group">
            <label><i class="fas fa-chalkboard"></i> Class</label>
            <select id="classFilter" onchange="onClassChange()">
              <option value="">-- All Classes --</option>
            </select>
          </div>
          
          <div class="filter-group">
            <label><i class="fas fa-book"></i> Subject</label>
            <select id="subjectFilter" onchange="onSubjectChange()" disabled>
              <option value="">-- Select Class First --</option>
            </select>
          </div>
          
          <div class="filter-group" style="flex: 0 0 auto;">
            <button class="filter-reset-btn" onclick="resetFilters()">
              <i class="fas fa-undo"></i> Reset
            </button>
          </div>
        </div>

        <!-- Search Bar -->
        <div class="search-wrap">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Search by assignment name, class or subject…" oninput="applyFilters()">
        </div>

        <div id="assignmentsContainer"></div>
      </div>
    </main>
  </div>

  <script src="../components.js"></script>
  <script>
    // ===== Session Guard =====
    function requireTeacherSession() {
      const stored = localStorage.getItem('messCurrentUser');
      const session = stored ? JSON.parse(stored) : null;
      if (!session || session.role !== 'teacher') {
        window.location.href = 'login.html';
        return false;
      }
      return true;
    }

    function loadComponents() {
      fetch('header.html').then(r => r.text()).then(data => document.getElementById('header-placeholder').innerHTML = data);
      fetch('sidebar.html').then(r => r.text()).then(data => document.getElementById('sidebar-placeholder').innerHTML = data);
    }

    window.onload = function() {
      if (!requireTeacherSession()) return;
      
      loadComponents();
      setTimeout(() => { 
        if (typeof window.initHeaderAndSidebar === 'function') window.initHeaderAndSidebar(); 
      }, 400);
      
      populateFilters();
      applyFilters();
    };

    // ===== Storage Helpers =====
    function loadFromStorage(key) {
      const stored = localStorage.getItem(key);
      return stored ? JSON.parse(stored) : [];
    }
    function saveToStorage(key, data) {
      localStorage.setItem(key, JSON.stringify(data));
    }
    function showToast(msg) {
      let t = document.createElement('div');
      t.className = 'toast-msg';
      t.innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2400);
    }

    function getCurrentTeacherRegNo() {
      const session = JSON.parse(localStorage.getItem('messCurrentUser'));
      return session ? session.regNo : null;
    }

    function getCurrentTeacherName() {
      const session = JSON.parse(localStorage.getItem('messCurrentUser'));
      return session ? session.name : null;
    }

    // ===== Filter State =====
    let allAssignments = [];
    let filterState = {
      classId: '',
      subjectName: ''
    };

    // ===== Populate Filters =====
    function populateFilters() {
      const teacherRegNo = getCurrentTeacherRegNo();
      if (!teacherRegNo) return;

      allAssignments = loadFromStorage('messAssignments')
        .filter(r => r.teacherRegNo === teacherRegNo);

      // Get unique classes
      const classes = [...new Set(allAssignments.map(r => r.classId))].sort();
      const classSelect = document.getElementById('classFilter');
      classSelect.innerHTML = '<option value="">-- All Classes --</option>';
      classes.forEach(cls => {
        classSelect.innerHTML += `<option value="${cls}">${cls}</option>`;
      });

      // Reset subject dropdown
      document.getElementById('subjectFilter').innerHTML = '<option value="">-- Select Class First --</option>';
      document.getElementById('subjectFilter').disabled = true;
    }

    // ===== On Class Change =====
    window.onClassChange = function() {
      const classId = document.getElementById('classFilter').value;
      filterState.classId = classId;
      
      const subjectSelect = document.getElementById('subjectFilter');
      
      if (!classId) {
        subjectSelect.innerHTML = '<option value="">-- Select Class First --</option>';
        subjectSelect.disabled = true;
        filterState.subjectName = '';
        applyFilters();
        return;
      }

      // Get unique subjects for this class
      const subjects = [...new Set(
        allAssignments
          .filter(r => r.classId === classId)
          .map(r => r.subjectName)
      )].sort();

      subjectSelect.innerHTML = '<option value="">-- All Subjects --</option>';
      subjects.forEach(sub => {
        subjectSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
      });
      subjectSelect.disabled = false;
      filterState.subjectName = '';
      
      applyFilters();
    };

    // ===== On Subject Change =====
    window.onSubjectChange = function() {
      filterState.subjectName = document.getElementById('subjectFilter').value;
      applyFilters();
    };

    // ===== Reset Filters =====
    window.resetFilters = function() {
      document.getElementById('classFilter').value = '';
      document.getElementById('subjectFilter').innerHTML = '<option value="">-- Select Class First --</option>';
      document.getElementById('subjectFilter').disabled = true;
      document.getElementById('searchInput').value = '';
      
      filterState = {
        classId: '',
        subjectName: ''
      };
      
      applyFilters();
    };

    // ===== Apply Filters =====
    function applyFilters() {
      const teacherRegNo = getCurrentTeacherRegNo();
      if (!teacherRegNo) return;

      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      
      let filtered = allAssignments;

      // Apply class filter
      if (filterState.classId) {
        filtered = filtered.filter(r => r.classId === filterState.classId);
      }

      // Apply subject filter
      if (filterState.subjectName) {
        filtered = filtered.filter(r => r.subjectName === filterState.subjectName);
      }

      // Apply search filter
      if (search) {
        filtered = filtered.filter(r =>
          r.name.toLowerCase().includes(search) ||
          r.className.toLowerCase().includes(search) ||
          r.subjectName.toLowerCase().includes(search) ||
          (r.description && r.description.toLowerCase().includes(search))
        );
      }

      // Sort by date (newest first)
      filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

      renderGroupedAssignments(filtered);
    }

    // ===== Render Grouped Assignments =====
    function renderGroupedAssignments(assignments) {
      const container = document.getElementById('assignmentsContainer');
      document.getElementById('recordCountBadge').textContent = assignments.length;

      if (assignments.length === 0) {
        container.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>No assignments found for the selected filters.</p></div>`;
        return;
      }

      // Group assignments by classId and subject
      const grouped = {};
      assignments.forEach(a => {
        const key = a.classId + '|' + a.subjectName;
        if (!grouped[key]) {
          grouped[key] = {
            classId: a.classId,
            className: a.className,
            subjectName: a.subjectName,
            assignments: []
          };
        }
        grouped[key].assignments.push(a);
      });

      container.innerHTML = Object.values(grouped).map((group, idx) => {
        const total = group.assignments.length;
        const hasFiles = group.assignments.filter(a => a.fileName).length;
        
        return `
          <details class="slip-accordion">
            <summary>
              <div class="summary-left">
                <i class="fas fa-folder-open slip-icon" style="color:#2563eb;"></i>
                <div>
                  <h3>${group.className} <span style="color:#94a3b8;font-weight:600;">(${group.classId})</span></h3>
                  <span>
                    Subject: <strong>${group.subjectName}</strong> · 
                    <span style="color:#2563eb;font-weight:600;">${total} assignment${total > 1 ? 's' : ''}</span>
                    ${hasFiles > 0 ? `· <span style="color:#22c55e;"><i class="fas fa-paperclip"></i> ${hasFiles} file${hasFiles > 1 ? 's' : ''}</span>` : ''}
                  </span>
                </div>
              </div>
              <div class="summary-right">
                <button type="button" class="delete-slip-btn" data-classid="${group.classId}" data-subject="${group.subjectName}">
                  <i class="fas fa-trash-alt"></i> Delete All
                </button>
                <i class="fas fa-chevron-down chevron"></i>
              </div>
            </summary>
            <div class="table-wrapper">
              <table class="exam-table">
                <thead>
                  <tr>
                    <th>Assignment Name</th>
                    <th>Date Posted</th>
                    <th>Description</th>
                    <th>File</th>
                    <th style="text-align:right">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  ${group.assignments.map((a, assignIdx) => {
                    const fileHtml = a.fileName 
                      ? `<div class="file-cell"><i class="fas fa-file"></i> ${a.fileName}</div>`
                      : `<span style="color:#94a3b8;">—</span>`;
                    const descDisplay = a.description ? a.description.substring(0, 60) + (a.description.length > 60 ? '...' : '') : '—';

                    return `
                      <tr>
                        <td><strong>${a.name}</strong></td>
                        <td>${a.date}</td>
                        <td class="desc-cell" title="${a.description || ''}">${descDisplay}</td>
                        <td>${fileHtml}</td>
                        <td style="text-align:right">
                          <div class="action-icons" style="display:flex;gap:8px;justify-content:flex-end;">
                            <i class="fas fa-trash-alt exam-delete-icon" data-id="${a.id}" title="Delete this assignment"></i>
                          </div>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </details>
        `;
      }).join('');

      // Delete entire group (all assignments for a class and subject)
      document.querySelectorAll('.delete-slip-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          deleteEntireGroup(btn.dataset.classid, btn.dataset.subject);
        });
      });

      // Delete single assignment
      document.querySelectorAll('.exam-delete-icon').forEach(icon => {
        icon.addEventListener('click', () => {
          deleteSingleAssignment(icon.dataset.id);
        });
      });
    }

    // ===== Delete Functions =====
    function deleteEntireGroup(classId, subjectName) {
      const teacherRegNo = getCurrentTeacherRegNo();
      if (!teacherRegNo) return;

      const assignments = loadFromStorage('messAssignments');
      const groupAssignments = assignments.filter(a => 
        a.classId === classId && 
        a.subjectName === subjectName && 
        a.teacherRegNo === teacherRegNo
      );
      
      if (groupAssignments.length === 0) return;

      const className = groupAssignments[0].className;

      if (!confirm(`Delete all ${groupAssignments.length} assignment${groupAssignments.length > 1 ? 's' : ''} for ${className} (${subjectName})?`)) return;

      // Delete all assignments for this class and subject
      const updated = assignments.filter(a => 
        !(a.classId === classId && 
          a.subjectName === subjectName && 
          a.teacherRegNo === teacherRegNo)
      );
      saveToStorage('messAssignments', updated);
      showToast(`🗑️ All ${groupAssignments.length} assignments deleted for ${className} (${subjectName})`);
      
      // Refresh all assignments and filters
      allAssignments = loadFromStorage('messAssignments').filter(r => r.teacherRegNo === teacherRegNo);
      applyFilters();
    }

    function deleteSingleAssignment(id) {
      const teacherRegNo = getCurrentTeacherRegNo();
      if (!teacherRegNo) return;

      const assignments = loadFromStorage('messAssignments');
      const assignment = assignments.find(a => a.id === id);
      if (!assignment) return;

      // Verify teacher owns this assignment
      if (assignment.teacherRegNo !== teacherRegNo) {
        showToast('⚠️ You can only delete assignments you posted');
        return;
      }

      if (!confirm(`Delete assignment "${assignment.name}" from ${assignment.className}?`)) return;

      const updated = assignments.filter(a => a.id !== id);
      saveToStorage('messAssignments', updated);
      showToast('🗑️ Assignment deleted');
      
      allAssignments = loadFromStorage('messAssignments').filter(r => r.teacherRegNo === teacherRegNo);
      applyFilters();
    }
  </script>
</body>
</html>
