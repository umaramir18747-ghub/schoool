<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEI – My Assignments</title>
   <link rel="icon" type="image/png" href="../logo2.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="../responsive-components.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="app-wrapper" id="appWrapper">
    <div id="sidebar-placeholder"></div>

    <main class="main-panel">
      <div class="page-header">
        <h1><i class="fas fa-file-pen" style="color:#2563eb;"></i> My Assignments</h1>
        <p>View hometasks posted by your teachers for each subject</p>
      </div>

      <div class="card">
        <div class="card-title">
          <i class="fas fa-chalkboard"></i> Class Overview
        </div>

        <!-- dynamic class info -->
        <div class="class-info-grid" id="classInfoGrid">
          <div class="class-info-item">
            <label><i class="fas fa-chalkboard-teacher"></i> Class Name</label>
            <span id="className">—</span>
          </div>
          <div class="class-info-item">
            <label><i class="fas fa-id-card"></i> Class ID</label>
            <span id="classId">—</span>
          </div>
          <div class="class-info-item">
            <label><i class="fas fa-layer-group"></i> Grade</label>
            <span id="grade">—</span>
          </div>
          <div class="class-info-item">
            <label><i class="fas fa-calendar-alt"></i> Session</label>
            <span id="session">—</span>
          </div>
          <div class="class-info-item">
            <label><i class="fas fa-tags"></i> Section</label>
            <span id="section">—</span>
          </div>
        </div>

        <!-- dynamic subjects grid -->
        <div class="subjects-grid" id="subjectsGrid"></div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="assignmentModal">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <h2><i class="fas fa-file-pen"></i> <span id="modalTitle">My Hometasks</span></h2>
          <div class="sub" id="modalSub">Subject</div>
        </div>
        <button class="modal-close" onclick="closeAssignmentModal()"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">

        <div class="result-table-wrap">
          <table class="result-table">
            <thead>
              <tr>
                <th>Hometask Name</th>
                <th>Description</th>
                <th>Attachment</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="assignmentTableBody">
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </div>

  <script src="../components.js"></script>
  <script src="student-assignments.js"></script>
</body>
</html>
