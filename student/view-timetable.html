<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EHS – My Timetable</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="../responsive-components.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,Roboto,sans-serif}
body{background:#f8fafc;color:#1e293b;line-height:1.6}
.main-panel{flex:1;padding:40px 32px;background:#f8fafc;min-height:calc(100vh - 70px)}
.page-header,.card{background:white;border-radius:0 !important;box-shadow:0 4px 25px rgba(0,0,0,.07);border:1px solid #f1f5f9}
.page-header{padding:40px 36px;margin-bottom:32px}
.page-header h1{font-size:28px;font-weight:700;color:#1e293b;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.page-header p{font-size:16px;color:#475569}
.card{padding:40px;margin-bottom:28px}
.card-title{font-size:19px;font-weight:700;color:#1e293b;margin-bottom:28px;padding-bottom:16px;border-bottom:2px solid #e5e7eb;display:flex;align-items:center;gap:12px}
.card-title i{color:#2563eb;font-size:22px}

/* Class info strip */
.class-info-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;background:#f8fafc;border:1.5px solid #e2e8f0;padding:24px 28px;margin-bottom:32px}
.class-info-item{display:flex;flex-direction:column;gap:6px}
.class-info-item label{font-size:12.5px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:6px}
.class-info-item span{font-size:15.5px;font-weight:600;color:#1e293b}

/* Timetable */
.tt-wrap{overflow-x:auto;border:1.5px solid #e2e8f0}
.tt-table{width:100%;border-collapse:collapse;min-width:900px}
.tt-table th{background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;padding:12px 14px;border:1px solid #dbeafe;text-align:center;white-space:nowrap}
.tt-table th .p-time{display:block;font-size:11px;font-weight:600;color:#2563eb;text-transform:none;letter-spacing:0;margin-top:2px}
.tt-table td{padding:14px;border:1px solid #f1f5f9;font-size:13.5px;font-weight:600;color:#1e293b;text-align:center;vertical-align:middle}
.tt-table td.day-cell{background:#f8fafc;font-weight:700;color:#334155;text-align:left;white-space:nowrap}
.tt-table td.empty-slot{color:#cbd5e1;font-weight:500}
.tt-table td.merged-slot{background:#f0f9ff;color:#0369a1;font-weight:700}

.empty-state{text-align:center;padding:60px 20px;color:#94a3b8}
.empty-state i{font-size:40px;margin-bottom:14px;display:block}
.empty-state p{font-size:15px;font-weight:600}
</style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="app-wrapper" id="appWrapper">
    <div id="sidebar-placeholder"></div>

    <main class="main-panel">
      <div class="page-header">
        <h1><i class="fas fa-clock" style="color:#2563eb;"></i> My Timetable</h1>
        <p>Weekly class schedule set by the administration</p>
      </div>

      <div class="card">
        <div class="card-title">
          <i class="fas fa-chalkboard"></i> Class Overview
        </div>

        <div class="class-info-grid">
          <div class="class-info-item">
            <label><i class="fas fa-chalkboard-teacher"></i> Class Name</label>
            <span id="ttClassName">—</span>
          </div>
          <div class="class-info-item">
            <label><i class="fas fa-id-card"></i> Class ID</label>
            <span id="ttClassId">—</span>
          </div>
          <div class="class-info-item">
            <label><i class="fas fa-layer-group"></i> Grade</label>
            <span id="ttGrade">—</span>
          </div>
          <div class="class-info-item">
            <label><i class="fas fa-calendar-alt"></i> Session</label>
            <span id="ttSession">—</span>
          </div>
          <div class="class-info-item">
            <label><i class="fas fa-tags"></i> Section</label>
            <span id="ttSection">—</span>
          </div>
        </div>

        <div id="ttContainer"></div>
      </div>
    </main>
  </div>

  <script src="../components.js"></script>
  <script>
    const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
    const PERIODS = 8;

    window.onload = function() {
      if (!requireStudentSession()) return;

      fetch('header.html').then(r=>r.text()).then(d=>{document.getElementById('header-placeholder').innerHTML=d;}).catch(e=>console.error(e));
      fetch('sidebar.html').then(r=>r.text()).then(d=>{document.getElementById('sidebar-placeholder').innerHTML=d;}).catch(e=>console.error(e));
      setTimeout(()=>{ if(typeof window.initHeaderAndSidebar==='function'){ window.initHeaderAndSidebar(); } },400);

      renderMyTimetable();
    };

    // ===== Session Guard =====
    function requireStudentSession() {
      const stored = localStorage.getItem('messCurrentUser');
      const session = stored ? JSON.parse(stored) : null;
      if (!session || session.role !== 'student') {
        window.location.href = 'login.html';
        return false;
      }
      return true;
    }

    // ===== Storage Helpers =====
    function loadFromStorage(key) {
      const stored = localStorage.getItem(key);
      return stored ? JSON.parse(stored) : [];
    }

    function formatTime12(t) {
      if (!t) return '';
      const [h, m] = t.split(':').map(Number);
      const period = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 === 0 ? 12 : h % 12;
      return `${String(h12).padStart(2,'0')}:${String(m).padStart(2,'0')} ${period}`;
    }

    function renderMyTimetable() {
      const session = JSON.parse(localStorage.getItem('messCurrentUser'));
      const students = loadFromStorage('messStudents');
      const student = students.find(s => s.regNo === session.regNo);
      if (!student) return;

      document.getElementById('ttClassName').textContent = student.className;
      document.getElementById('ttClassId').textContent = student.classId;
      document.getElementById('ttGrade').textContent = student.grade;
      document.getElementById('ttSession').textContent = student.session;
      document.getElementById('ttSection').textContent = student.section;

      const timetables = loadFromStorage('messTimetables');
      const myTimetable = timetables.find(t => t.classId === student.classId);
      const container = document.getElementById('ttContainer');

      if (!myTimetable) {
        container.innerHTML = `<div class="empty-state"><i class="fas fa-calendar-xmark"></i><p>No timetable has been set for your class yet.</p></div>`;
        return;
      }

      const periods = myTimetable.periods && myTimetable.periods.length === PERIODS
        ? myTimetable.periods
        : Array.from({ length: PERIODS }, (_, i) => ({ name: `Period ${i+1}`, start: '08:00', end: '09:00' }));
      const subjects = myTimetable.subjects || DAYS.map(() => Array(PERIODS).fill(''));
      const merges = myTimetable.merges || [];

      let headerHtml = '<th>Day / Period</th>' + periods.map(p =>
        `<th>${p.name}<span class="p-time">${formatTime12(p.start)} - ${formatTime12(p.end)}</span></th>`
      ).join('');

      let rowsHtml = '';
      DAYS.forEach((day, row) => {
        let cellsHtml = `<td class="day-cell">${day}</td>`;
        let col = 0;
        while (col < PERIODS) {
          const block = merges.find(m => m.rowIdx === row && m.startCol <= col && m.endCol >= col);
          if (block && block.startCol === col) {
            const span = block.endCol - block.startCol + 1;
            const subject = block.subjectText || subjects[row]?.[col] || '';
            cellsHtml += `<td colspan="${span}" class="${subject ? 'merged-slot' : 'empty-slot'}">${subject || '—'}</td>`;
            col = block.endCol + 1;
          } else {
            const subject = subjects[row]?.[col] || '';
            cellsHtml += `<td class="${subject ? '' : 'empty-slot'}">${subject || '—'}</td>`;
            col++;
          }
        }
        rowsHtml += `<tr>${cellsHtml}</tr>`;
      });

      container.innerHTML = `
        <div class="tt-wrap">
          <table class="tt-table">
            <thead><tr>${headerHtml}</tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
      `;
    }
  </script>
</body>
</html>
